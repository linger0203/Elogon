<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="0ySDD5JOKCLpW8800wLTI0">
<head data-page-node-id="HeRHnyAM6x0xGCpMHjO3sJ">
<meta charset="UTF-8" data-page-node-id="hWzMRwnp6ECC1E8USPmqa5">
<title>E 登录 Mac 版 · 联动原型</title>
<style>
:root{
  --brand:#007AFF; --brand-hover:#0069DB; --brand-press:#0059BC;
  --brand-soft:#EAF3FF; --brand-mid:#B3D7FF;
  --bg-page:#F4F5F7; --bg-card:#FFFFFF; --bg-field:#F7F8FA; --bg-hover:#F0F1F4;
  --border-card:#E8EAED; --border-field:#DDE0E4;
  --text-1:#1A1D21; --text-2:#6B7280; --text-3:#9CA3AF; --text-on:#FFFFFF;
  --success:#34C759; --success-soft:#EAF9EE;
  --warning:#FF9500; --warning-soft:#FFF4E5;
  --danger:#FF3B30; --danger-soft:#FFEDEC;
  --r-card:16px; --r-field:10px; --r-btn:10px; --r-tag:8px; --r-win:12px;
  --h-field:34px; --h-btn:34px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:#DDE3EA; color:var(--text-1); font-size:13px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}

/* ============ 整体布局：桌面 + 右侧流程轨道 ============ */
.shell{display:flex;height:100vh}

/* ---- 桌面区 ---- */
.desk-wrap{flex:1;display:flex;flex-direction:column;min-width:0;
  background:linear-gradient(160deg,#8FA8C8 0%,#6E8BB0 40%,#4E6B92 100%);
  position:relative;overflow:hidden}
.desk-wrap::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 18% 22%,rgba(255,255,255,.20) 0%,transparent 42%),
    radial-gradient(circle at 76% 74%,rgba(255,255,255,.13) 0%,transparent 46%);
  pointer-events:none}

/* ---- macOS 顶部菜单栏 ---- */
.menubar{
  height:26px;flex:0 0 auto;display:flex;align-items:center;
  padding:0 12px;gap:16px;font-size:11.5px;color:#1A1D21;
  background:rgba(255,255,255,.62);backdrop-filter:blur(20px);
  border-bottom:.5px solid rgba(0,0,0,.07);position:relative;z-index:30}
.menubar .left{display:flex;gap:15px;align-items:center}
.menubar .right{margin-left:auto;display:flex;gap:13px;align-items:center}
.menubar .apple{font-size:13px;line-height:1}
.mb-app{display:flex;align-items:center;gap:4px}
.mb-app img{width:14px;height:14px;display:block}

/* ---- 桌面工作区 ---- */
.desk{flex:1;position:relative;overflow:hidden;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;
  padding:14px 14px 58px}

/* ============ 窗口通用 ============ */
.win{
  width:400px;background:var(--bg-card);
  border:.5px solid rgba(0,0,0,.10);border-radius:var(--r-win);
  box-shadow:0 12px 40px rgba(0,0,0,.24),0 2px 8px rgba(0,0,0,.12);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;flex:0 1 auto;
  height:auto;max-height:100%;max-width:100%;
  animation:winIn .22s cubic-bezier(.32,.72,0,1)}
@keyframes winIn{from{opacity:0;transform:translateY(6px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.titlebar{
  height:36px;flex:0 0 auto;display:flex;align-items:center;
  padding:0 12px;background:#F6F7F9;border-bottom:.5px solid var(--border-card)}
.lights{display:flex;gap:7px}
.lights i{width:11px;height:11px;border-radius:50%;display:block;cursor:pointer;
  position:relative;transition:filter .12s ease}
.lights i:hover{filter:brightness(.88)}
.lights i:active{filter:brightness(.76)}
/* 窗口关闭 / 最小化动画 */
.win.closing{animation:winOut .16s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.96)}}
.win.minishing{animation:winMin .22s cubic-bezier(.4,0,1,1) forwards}
@keyframes winMin{to{opacity:0;transform:translateY(140px) scale(.5)}}
/* 窗口最大化：铺满桌面工作区 */
.win.maxed{width:100% !important;max-width:100% !important;
  height:calc(100% - 8px) !important;max-height:calc(100% - 8px) !important}
/* 最大化时内容居中，避免表单被无限拉伸 */
.win.maxed .body{justify-content:center}
/* 桌面空白提示 */
.deskblank-tip{display:flex;flex-direction:column;align-items:center;gap:10px;
  text-align:center;padding:26px 30px;border-radius:var(--r-win);
  overflow:hidden;
  background:rgba(255,255,255,.52);backdrop-filter:blur(18px);
  border:.5px solid rgba(255,255,255,.60);box-shadow:0 8px 28px rgba(0,0,0,.14)}
.deskblank-tip .dbt{font-size:13.5px;font-weight:500;color:var(--text-1)}
.deskblank-tip .dbs{font-size:11.5px;color:var(--text-2);line-height:1.55;max-width:220px}
.deskblank-tip .btn{margin-top:2px}
.lights i:nth-child(1){background:#FF5F57}
.lights i:nth-child(2){background:#FEBC2E}
.lights i:nth-child(3){background:#28C840}
.titlebar .t{flex:1;text-align:center;font-size:11.5px;color:var(--text-2);margin-right:44px}
.body{padding:18px 24px 18px;display:flex;flex-direction:column;gap:12px;
  overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0}
.body.no-scroll{overflow-y:hidden}
.body::-webkit-scrollbar{width:8px}
.body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:4px}
.body::-webkit-scrollbar-track{background:transparent}

/* ============ 网络提示条：窗口顶部通栏 ============ */
.netbar{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;font-size:11.5px;line-height:1.4;flex:0 0 auto;
  animation:netIn .2s ease}
@keyframes netIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.netbar svg{flex:0 0 auto}
.net-weak{background:var(--warning-soft);color:#8A4B00}
.net-off{background:var(--danger-soft);color:#A32620}
.net-re{background:var(--brand-soft);color:#0C447C}
.net-ok{background:var(--success-soft);color:#1D6B32}
.netbar .retry{
  margin-left:6px;font-size:11px;color:#A32620;text-decoration:underline;
  cursor:pointer;background:none;border:none;font-family:inherit;padding:0}

/* ============ 品牌区 ============ */
.brand{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;flex:0 0 auto}
.brand.row{flex-direction:row;align-items:center;text-align:left;gap:11px}
.brand img{display:block;flex:0 0 auto}
.brand h1{font-size:17px;font-weight:600;letter-spacing:-.35px;line-height:1.3}
.brand p{font-size:12px;color:var(--text-3);line-height:1.5;margin-top:-2px}
.brand .txt{display:flex;flex-direction:column;justify-content:center;min-width:0}
.brand .txt h1{white-space:nowrap}
/* 简洁版：logo 圆角底座（参考「首次登录」样式） */
.brand .logo-box{width:64px;height:64px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#FAFCFB 0%,#EDF3F1 100%);
  border:.5px solid rgba(0,0,0,.055);
  box-shadow:0 1px 2px rgba(0,0,0,.035),0 5px 14px rgba(0,0,0,.055)}
.brand .logo-box img{width:42px;height:42px}

/* ============ 分段标签（登录方式） ============
   v1.0.16：认证方式从 4 种扩到 6 种（加人脸、指纹）。
   原来用文字标签「账密登录 / 扫码登录 / 短信登录 / 动态口令」，4 格时每格 88px 够用；
   6 格只剩 58px，四个字放不下。改成「图标 + 两字标签」的竖排格：
   格宽由 grid-auto-columns:1fr 均分，后台只配 2 种时两格各占一半、居中，
   不会留空格 —— 数量由渲染层决定，样式不写死列数。 */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;
  background:var(--bg-field);padding:3px;border-radius:var(--r-field)}
.tabs button{
  height:27px;border:none;background:transparent;border-radius:7px;
  font-size:11px;font-family:inherit;color:var(--text-2);cursor:pointer;
  transition:background .12s ease,color .12s ease;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  line-height:1;padding:0}
.tabs button svg{width:13px;height:13px;display:block}
.tabs button:hover{color:var(--text-1)}
.tabs button.on{background:#fff;color:var(--brand);font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.07)}

/* ============ 生物识别采集区（人脸 / 指纹） ============
   样式对齐沁给的参考图：大圆形取景框 + 人像剪影 + 扫描线 +
   三列提示（保持光线充足 / 脸在取景框内 / 面部正对屏幕）+ 大按钮。
   指纹则是大号蓝色线稿 + 一句提示，不套取景框。

   ★ 口径（沁 2026-11-05 确认）：人脸与指纹的**录入 / 绑定不在本客户端做**，
   用户在企业侧已具备这两项能力，客户端拿到的只是「能否比对通过」。
   所以界面上不出现任何「录入」「绑定」「首次采集」的入口与文案。 */
.bio2{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:8px 0 2px}
.maskwrap{width:118px;height:118px;border-radius:50%;position:relative;
  background:linear-gradient(180deg,#EAF3FF 0%,#F7FBFF 100%);
  border:3px solid #BBD6FA;display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;transition:border-color .18s ease,background .18s ease}
.maskwrap .psn{display:block;flex:0 0 auto;transition:opacity .18s ease}
.maskwrap.busy{border-color:var(--brand)}
.maskwrap.busy .psn{opacity:.86}
.maskwrap.ok{border-color:#34C759;background:#F0FAF3}
.maskwrap.ok .psn{opacity:.35}
.maskwrap .scanline{position:absolute;left:6%;right:6%;height:2px;border-radius:1px;
  background:var(--brand);box-shadow:0 0 7px rgba(0,123,255,.75);
  animation:scanmove 1.5s ease-in-out infinite;z-index:2}
@keyframes scanmove{0%{top:12%}50%{top:84%}100%{top:12%}}
.maskwrap .okmark,.fpbig .okmark{position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;z-index:3}

.bio2 .ttl{font-size:12.5px;color:var(--text-2);text-align:center;line-height:1.5}
.biotips{display:flex;align-items:flex-start;justify-content:center;gap:12px;
  margin-top:1px}
.biotips .tip{display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text-2);opacity:.82;width:62px}
.biotips .tip svg{width:16px;height:16px;color:var(--text-2)}
.biotips .tip span{font-size:9.5px;line-height:1.3;text-align:center;white-space:nowrap}
.biotips.gone{visibility:hidden}

/* 指纹：大号线稿，颜色取参考图的蓝 */
.fpbig{width:118px;height:118px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;background:#F2F7FF;
  border:1px solid #DCE9FA;position:relative}
.fpbig svg{width:72px;height:72px;color:#5B8DEF}
.fpbig.busy svg{color:var(--brand)}
.fpbig.ok{background:#F0FAF3;border-color:#BFE6CC}
.fpbig.ok svg{opacity:.28}

/* ============ 改密页 ============ */
.chpw .lead{font-size:12.5px;color:var(--text-2);line-height:1.6}
.chpw .lead b{color:var(--text-1);font-weight:500}
.reqbox{background:var(--bg-field);border-radius:var(--r-field);padding:9px 12px;
  font-size:11.5px;color:var(--text-2);line-height:1.75}
.reqbox .it{display:flex;gap:6px;align-items:flex-start}
.reqbox .it.ok{color:#1D6B32}
.reqbox .it.no{color:#A32620}
.reqbox .bul{width:12px;flex:0 0 12px;text-align:center;font-weight:500;
  display:flex;align-items:center;justify-content:center;height:16px}
.reqbox .bul svg{display:block}

/* 改密原因：抬头回显「您好，XXX」，副标题一句话、灰色、不带标点。
   v1.0.20 先把副标题按紧迫度分了红 / 琥珀 / 灰三色，实测反而像报错 ——
   这一页是登录流程里的一员，不是事故页，颜色统一回灰，靠字词表达轻重。 */
.chpw .brand p b{font-weight:600;font-variant-numeric:tabular-nums}

/* ============ 二次验证页（整页，不是弹层） ============
   v1.0.17：原来是半透明蒙层盖在登录表单上，看着像弹窗。
   改为整页切换 —— 和改密页一样把窗口内容整个换掉，品牌区、标题、
   方式切换、输入、按钮一应俱全，返回走页面里的「返回上一级」。
   （对齐移动端「进入下一页」的心智，不是「叠一个框」。） */
.backrow{margin-top:2px;display:flex;justify-content:center}
.backbtn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;
  padding:4px 6px;cursor:pointer;font-family:inherit;font-size:11.5px;
  color:var(--text-2);border-radius:6px}
.backbtn:hover{color:var(--text-1);text-decoration:underline}
.backbtn svg{width:11px;height:11px}

/* ============ 表单 ============ */
.field{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.field label{font-size:12px;color:var(--text-2);font-weight:500}
.input{
  height:var(--h-field);padding:0 11px;width:100%;
  border:1px solid var(--border-field);border-radius:var(--r-field);
  background:var(--bg-field);font-size:13px;font-family:inherit;color:var(--text-1);
  outline:none;transition:border-color .12s ease,background .12s ease,box-shadow .12s ease}
.input::placeholder{color:var(--text-3)}
.input:hover{border-color:#C9CDD3}
.input:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,122,255,.14)}
.input[readonly]{background:#F0F2F5;color:var(--text-2);cursor:default}
.input[readonly]:focus{background:#F0F2F5;border-color:var(--border-field);box-shadow:none}
/* ⚠️ 必须带 .ipt 前缀：与 .ipt .input 同为 2 个 class 时，后出现的 .ipt .input 会赢，
   红框静默失效（v1.0.6 实测发现 —— 绑定失败页的红框此前一直是假的） */
.input.bad,.ipt .input.bad{border-color:var(--danger);background:#FFF8F8}
.input.bad:focus,.ipt .input.bad:focus{box-shadow:0 0 0 3px rgba(255,59,48,.13)}

/* ============ 简洁版：图标内嵌输入框 ============ */
.ipt{position:relative;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ipt .lead{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;pointer-events:none;color:#9CA3AF;
  transition:color .12s ease}
.ipt .input{height:44px;padding:0 14px 0 41px;font-size:13.5px;
  border-radius:10px;background:#fff;border-color:#E3E6EA;
  flex:1 1 auto;min-width:0}
.ipt>.btn{flex:0 0 auto}
.ipt .input::placeholder{color:#A5ABB4}
.ipt .input:hover{border-color:#CFD4DA}
.ipt .input:focus{border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 3px rgba(0,122,255,.13)}
.ipt:focus-within .lead{color:var(--brand)}
.ipt.has-eye .input{padding-right:44px}
.ipt .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;padding:0;cursor:pointer;color:#A5ABB4;
  border-radius:7px;transition:color .12s ease,background .12s ease}
.ipt .eye:hover{color:#6B7280;background:rgba(0,0,0,.045)}
.ipt .input:focus~.eye{color:var(--brand)}
/* 只读行（macOS 本机账户） */
.ipt.os .input{background:#F7F8FA;border-color:#E9ECEF;color:var(--text-1);
  cursor:default}
.ipt.os .input:hover{border-color:#E9ECEF}
.ipt.os .input:focus{background:#F7F8FA;border-color:#E9ECEF;box-shadow:none}
.ipt.os .lead{color:#A9AFB7}

.rowline{display:flex;gap:8px;align-items:stretch}
.rowline .input{flex:1;min-width:0}
.rowline .btn{flex:0 0 auto;white-space:nowrap;padding:0 13px}

.hint{font-size:11px;color:var(--text-3);line-height:1.5}
.hint.err{color:var(--danger)}
.errmsg{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;
  color:var(--danger);background:var(--danger-soft);
  padding:8px 11px;border-radius:var(--r-field);line-height:1.5}
.errmsg svg{flex:0 0 auto;margin-top:2px}

/* ============ 按钮 ============ */
.btn{height:var(--h-btn);min-height:var(--h-btn);padding:0 15px;border-radius:var(--r-btn);
  font-size:13px;font-family:inherit;cursor:pointer;
  border:1px solid transparent;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;transition:background .12s ease,border-color .12s ease;
  white-space:nowrap;flex:0 0 auto;box-sizing:border-box}
.btn-primary{background:var(--brand);color:var(--text-on);border-color:var(--brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-primary:active{background:var(--brand-press)}
.btn-secondary{background:#fff;color:var(--text-1);border-color:var(--border-field)}
.btn-secondary:hover{background:var(--bg-hover)}
.btn-quiet{background:transparent;color:var(--text-2);border-color:transparent}
.btn-quiet:hover{background:var(--bg-hover);color:var(--text-1)}
.btn-block{width:100%}
.btn[disabled]{background:var(--bg-field);color:var(--text-3);
  border-color:var(--border-card);cursor:not-allowed}
.btn[disabled]:hover{background:var(--bg-field)}

.footrow{display:flex;align-items:center;justify-content:flex-end;
  gap:6px;font-size:11.5px;color:var(--text-3);margin-top:2px}
.footrow .lnk{color:var(--text-2);cursor:pointer;background:none;border:none;
  font-family:inherit;font-size:11.5px;padding:0}
.footrow .lnk:hover{color:var(--text-1);text-decoration:underline}
.footrow .lnk.danger{color:var(--text-2)}
.footrow .lnk.danger:hover{color:var(--danger)}
.dotsep{color:var(--border-field)}

/* ============ 密码策略清单 ============ */
.policy{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.policy .pi{display:flex;align-items:flex-start;gap:6px;font-size:11px;
  color:var(--text-3);line-height:1.5}
.policy .pi .mk{flex:0 0 auto;width:13px;height:13px;border-radius:50%;
  border:1px solid var(--border-field);margin-top:1.5px;
  display:flex;align-items:center;justify-content:center}
.policy .pi.ok{color:#1D6B32}
.policy .pi.ok .mk{background:var(--success);border-color:var(--success)}
.policy .pi.no{color:var(--danger)}
.policy .pi.no .mk{background:var(--danger);border-color:var(--danger)}

/* ============ 步骤分节 ============ */
.stepnum{display:flex;align-items:center;gap:7px;font-size:12px;
  font-weight:500;color:var(--text-1)}
.stepnum .n{width:17px;height:17px;border-radius:50%;background:var(--brand-soft);
  color:var(--brand);font-size:10.5px;font-weight:500;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stepnum.lock{color:var(--text-3)}
.stepnum.lock .n{background:var(--bg-field);color:var(--text-3)}
.divider{height:1px;background:var(--border-card);margin:2px 0}
.seg{display:inline-flex;background:var(--bg-field);padding:3px;
  border-radius:var(--r-field);gap:3px}
.seg span{font-size:11.5px;padding:4px 11px;border-radius:7px;
  color:var(--text-2);cursor:pointer;transition:background .12s,color .12s}
.seg span.on{background:#fff;color:var(--brand);font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.07)}

/* ============ 忘记密码：验证渠道下拉（v1.0.5，对齐参考图） ============ */
.ipt select.selin{padding:0 34px 0 41px;cursor:pointer;
  appearance:none;-webkit-appearance:none;-moz-appearance:none}
.ipt select.selin::-ms-expand{display:none}
.ipt .chev{position:absolute;right:13px;top:50%;transform:translateY(-50%);
  display:flex;pointer-events:none;color:#9CA3AF;transition:color .12s ease}
.ipt:focus-within .chev{color:var(--brand)}

/* ============ 忘记密码：标题行 + 返回箭头 ============ */
.head{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.back{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--text-2);flex:0 0 auto;
  background:none;border:none;padding:0}
.back:hover{background:var(--bg-hover)}
.head h1{font-size:17px;font-weight:600;letter-spacing:-.35px;line-height:1.3}

/* ============ 验证码按钮：做进输入框右端 ============ */
.codebtn{display:flex;align-items:center;gap:5px;flex:0 0 auto;
  background:none;border:0;font-family:inherit;font-size:12.5px;color:var(--text-1);
  cursor:pointer;white-space:nowrap;transition:color .12s ease}
.codebtn svg{color:var(--text-3);flex:0 0 auto;transition:color .12s ease}
.codebtn:hover{color:var(--brand)}
.codebtn:hover svg{color:var(--brand)}
.codebtn[disabled]{color:var(--text-3);cursor:not-allowed}
.codebtn[disabled] svg{color:#C3C8CF}
.ipt.has-code .input{padding-right:118px}
.ipt .codebtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  padding-left:10px;border-left:1px solid #E3E6EA}

/* ============ 密码要求浮层 ============ */
.reqpop{position:absolute;right:0;bottom:calc(100% + 8px);width:216px;z-index:20;
  background:#fff;border:.5px solid rgba(0,0,0,.10);border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);
  padding:11px 13px 12px;display:none}
.reqpop.show{display:block}
.reqpop .rt{font-size:12px;font-weight:600;color:var(--text-1);margin-bottom:1px}
.reqpop .pi{display:flex;align-items:flex-start;gap:7px;margin-top:7px;
  font-size:11.5px;line-height:1.55;color:var(--text-2)}
.reqpop .pi .mk{width:12px;height:12px;flex:0 0 auto;margin-top:3px;border-radius:50%;
  background:#B6BCC4;display:flex;align-items:center;justify-content:center}
.reqpop .pi .mk i{width:3.5px;height:3.5px;border-radius:50%;background:#fff;display:block}
.reqpop .pi .mk svg{display:block}
.reqpop .pi.ok{color:#248A3D}
.reqpop .pi.ok .mk{background:#34C759}
.reqpop .pi.no{color:#C92A21}
.reqpop .pi.no .mk{background:#FF3B30}

/* ============ 密码框 ⓘ 要求按钮 ============ */
.ipt .info{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;padding:0;cursor:pointer;color:#A5ABB4;
  border-radius:7px;transition:color .12s ease,background .12s ease}
.ipt .info:hover{color:#6B7280;background:rgba(0,0,0,.045)}
.ipt.has-info .eye{right:36px}
.ipt.has-eye.has-info .input{padding-right:76px}

/* ============ 锁定区（验证码通过前置灰） ============ */
.locked{opacity:.45;pointer-events:none;filter:saturate(.3)}

/* ============ 倒计时 ============ */
.timer{display:flex;align-items:center;gap:6px;font-size:11.5px;
  color:#8A4B00;background:var(--warning-soft);padding:7px 11px;
  border-radius:var(--r-field);justify-content:center}
.timer b{font-weight:600;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.bar{height:3px;background:var(--warning-soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--warning);
  transition:width 1s linear}

/* 忘密页计时卡：进度条做进卡片底边，省一行高度（窗口高度受限） */
.timer{position:relative;overflow:hidden;padding-bottom:8px}
.timer .tbar{position:absolute;left:0;bottom:0;height:2px;
  background:var(--warning);transition:width 1s linear}
/* 忘密页主按钮：与输入框等高（44px），对齐参考图 */
.fp-ok{height:44px;min-height:44px;font-size:13.5px;border-radius:10px}

/* ============ 滑块 ============ */
.slider{height:40px;background:var(--bg-field);border:1px solid var(--border-field);
  border-radius:var(--r-field);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;user-select:none}
.slider .track{font-size:11.5px;color:var(--text-3);pointer-events:none}
.slider .thumb{
  position:absolute;left:2px;top:2px;width:44px;height:34px;
  background:#fff;border:.5px solid var(--border-field);border-radius:8px;
  display:flex;align-items:center;justify-content:center;cursor:grab;
  box-shadow:0 1px 3px rgba(0,0,0,.10);transition:background .12s}
.slider .thumb:active{cursor:grabbing}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:var(--brand-soft);width:0}
.slider.done .fill{background:var(--success-soft)}
.slider.done .track{color:#1D6B32}
.pop-r{position:absolute;right:2px;top:2px;bottom:2px;width:44px;border-radius:8px;
  background:transparent;pointer-events:none}

/* ============ 二维码 ============ */
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:11px;padding:4px 0}
.qrbox{width:150px;height:150px;background:#fff;border:1px solid var(--border-card);
  border-radius:10px;padding:9px;position:relative}
.qrbox svg{display:block;width:100%;height:100%}
.qrbox .mask{
  position:absolute;inset:0;background:rgba(255,255,255,.93);
  border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  font-size:12px;color:var(--text-2)}
.qrbox .mask .again{color:var(--brand);cursor:pointer;font-weight:500}
.qrbox .mask .again:hover{text-decoration:underline}
.qrstatus{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2)}
.spin{width:11px;height:11px;border:1.5px solid var(--brand-mid);
  border-top-color:var(--brand);border-radius:50%;
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qrnote{font-size:11px;color:var(--text-3);text-align:center}
.qrnote b{color:var(--text-2);font-weight:500}

/* ============ 菜单栏面板 ============ */
.pop{
  position:absolute;top:9px;right:56px;width:320px;
  background:rgba(252,252,253,.94);backdrop-filter:blur(24px);
  border:.5px solid rgba(0,0,0,.12);border-radius:var(--r-win);
  box-shadow:0 12px 38px rgba(0,0,0,.24),0 2px 8px rgba(0,0,0,.10);
  overflow:hidden;animation:popIn .16s cubic-bezier(.32,.72,0,1)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}
  to{opacity:1;transform:none}}
.bindrow{display:flex;align-items:center;gap:10px;padding:12px 13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:500;flex:0 0 auto}
.bindrow .meta{flex:1;min-width:0}
.bindrow .meta .hi{font-size:12.5px;font-weight:500;color:var(--text-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bindrow .meta .id{font-size:10.5px;color:var(--text-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-ok{font-size:10px;color:#248A3D;background:var(--success-soft);
  padding:1px 6px;border-radius:5px;font-weight:500;flex:0 0 auto}
.sep{height:.5px;background:rgba(0,0,0,.09)}
.mi{display:flex;align-items:center;gap:10px;padding:8px 13px;
  font-size:13px;color:var(--text-1);cursor:pointer;white-space:nowrap;
  background:none;border:none;font-family:inherit;width:100%;text-align:left}
.mi:hover{background:rgba(0,0,0,.045)}
.mi .ico{flex:0 0 auto;display:flex;width:16px;justify-content:center}
.mi .txt{flex:0 0 auto;white-space:nowrap}
.mi .spacer{flex:1 1 auto;min-width:0}
.mi .badge{flex:0 0 auto;font-size:11px;color:var(--brand);
  background:var(--brand-soft);padding:1px 6px;border-radius:6px;font-weight:500}
.mi.danger:hover{background:rgba(0,0,0,.045)}

/* 菜单栏图标 */
.mb-app img{width:14px;height:14px;display:block}

/* ============ 弹窗 ============ */
.overlay{position:absolute;inset:0;background:rgba(20,22,26,.30);
  display:flex;align-items:center;justify-content:center;z-index:20;
  animation:ovIn .15s ease}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.dialog{width:340px;background:#fff;border-radius:var(--r-win);
  box-shadow:0 16px 48px rgba(0,0,0,.30);overflow:hidden;
  animation:winIn .2s cubic-bezier(.32,.72,0,1);
  position:relative;left:auto;top:auto;transform:none}
.dialog .dbody{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dialog h3{font-size:14px;font-weight:500}
.dialog p{font-size:12.5px;color:var(--text-2);line-height:1.65}
.dialog .acts{display:flex;gap:8px;margin-top:4px}
.dialog .acts .btn{flex:1}

/* ============ 简洁版登录窗口（绑定 / 退出后登录页） ============ */
/* 绑定窗口比原先多一行副标题，13px 间距会让窗口顶到上限并挤出滚动条，收 2px 即可 */
.win.auth .body{gap:11px;padding:20px 24px 18px}
.win.auth .tabs{background:#F4F5F7;border-radius:10px}
/* 6 种方式竖排：图标 13 + 文字 11，44px 刚好留出上下各 4px 呼吸 */
.win.auth .tabs button{height:42px;font-size:11px;border-radius:8px;gap:3px}
.win.auth .tabs button svg{width:15px;height:15px}
.win.auth .btn-block{height:44px;min-height:44px;font-size:13.5px;border-radius:10px}
.win.auth .footrow{margin-top:1px}
/* 窗口要用 position:relative 兜住弹窗类绝对定位（注销确认等仍是弹窗） */
.win.auth{position:relative}

/* ============ 卡片式设置窗口 ============ */
.win.set{width:400px}
.setrow{display:flex;align-items:center;gap:11px;padding:9px 0}
.setrow .ico{width:22px;height:22px;border-radius:6px;background:var(--bg-field);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.setrow .meta{flex:1;min-width:0}
.setrow .meta .t{font-size:13px;color:var(--text-1)}
.setrow .meta .s{font-size:11px;color:var(--text-3);line-height:1.45}
.setrow .ctl{flex:0 0 auto}
.groupname{font-size:11px;color:var(--text-3);font-weight:500;
  letter-spacing:.3px;margin-top:3px}
.sw{width:38px;height:22px;border-radius:11px;background:#D3D7DD;
  position:relative;cursor:pointer;border:none;padding:0;flex:0 0 auto;
  transition:background .16s ease}
.sw::after{content:"";position:absolute;top:2px;left:2px;
  width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .16s cubic-bezier(.32,.72,0,1)}
.sw.on{background:var(--success)}
.sw.on::after{transform:translateX(16px)}
.about{display:flex;align-items:center;gap:11px;padding:12px;
  background:var(--bg-field);border-radius:var(--r-field);margin-top:3px}
.about img{width:38px;height:38px;display:block;flex:0 0 auto}
.about .txt{flex:1;min-width:0}
.about .txt .n{font-size:13.5px;font-weight:500}
.about .txt .v{font-size:11.5px;color:var(--text-3);
  font-family:ui-monospace,Menlo,Consolas,monospace}

/* ============ 访问应用门户（浏览器窗口） ============ */
.win.browser{width:520px}
.urlbar{height:32px;flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:#F6F7F9;border-bottom:.5px solid var(--border-card)}
.urlbar .pill{flex:1;height:21px;background:#fff;border-radius:10px;
  border:.5px solid var(--border-card);display:flex;align-items:center;
  padding:0 10px;font-size:11px;color:var(--text-3);gap:5px}
.apps{padding:16px 20px;display:grid;
  grid-template-columns:repeat(4,1fr);gap:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px 6px;border-radius:var(--r-field);cursor:pointer;
  transition:background .12s ease;border:1px solid transparent}
.app:hover{background:var(--bg-hover);border-color:var(--border-card)}
.app .sq{width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;font-weight:500}
.app .nm{font-size:11px;color:var(--text-2);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sso{display:flex;align-items:center;gap:7px;justify-content:center;
  font-size:11.5px;color:#1D6B32;background:var(--success-soft);
  padding:7px 11px;border-radius:var(--r-field)}

/* ============ Dock ============ */
.dock{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:7px;padding:7px 9px;
  background:rgba(255,255,255,.40);backdrop-filter:blur(24px);
  border:.5px solid rgba(255,255,255,.50);border-radius:16px;
  box-shadow:0 6px 22px rgba(0,0,0,.16);z-index:5}
.dock i{width:34px;height:34px;border-radius:8px;display:block}
.dock .d1{background:linear-gradient(180deg,#4FA3F7,#1E6FD9)}
.dock .d2{background:linear-gradient(180deg,#F5F7FA,#C9D2DC)}
.dock .d3{background:linear-gradient(180deg,#FFB84D,#E8890B)}
.dock .d4{background:linear-gradient(180deg,#6FCB6F,#2E8B2E)}
.dock .d5{background:linear-gradient(180deg,#B58BE8,#7A4FC0)}
.dock .elogon{background:#fff;display:flex;align-items:center;
  justify-content:center;border:.5px solid rgba(0,0,0,.08);cursor:pointer;
  transition:transform .12s ease}
.dock .elogon:hover{transform:translateY(-3px)}
.dock .elogon:active{transform:translateY(-1px) scale(.96)}
.dock .elogon img{width:24px;height:24px;display:block}

/* ============ 右侧流程轨道 ============ */
.rail{
  width:290px;flex:0 0 auto;background:#FBFCFD;border-left:1px solid var(--border-card);
  display:flex;flex-direction:column;overflow:hidden}
.rail-h{padding:14px 16px 12px;border-bottom:1px solid var(--border-card);
  display:flex;align-items:flex-start;gap:8px}
.rail-h .t{flex:1}
.rail-h h2{font-size:13px;font-weight:500}
.rail-h p{font-size:11px;color:var(--text-3);margin-top:2px}
.rail-h .fold{
  background:none;border:none;cursor:pointer;color:var(--text-3);
  font-size:15px;line-height:1;padding:2px 4px;font-family:inherit}
.rail-h .fold:hover{color:var(--text-1)}
.rail-b{flex:1;overflow-y:auto;padding:12px 16px 18px}
.rail-b::-webkit-scrollbar{width:6px}
.rail-b::-webkit-scrollbar-thumb{background:#D8DCE2;border-radius:3px}

.secname{font-size:10.5px;color:var(--text-3);font-weight:500;
  letter-spacing:.4px;margin:14px 0 7px}
.secname:first-child{margin-top:0}

.node{
  display:flex;align-items:flex-start;gap:9px;padding:7px 9px;
  border-radius:9px;cursor:pointer;border:1px solid transparent;
  transition:background .12s ease,border-color .12s ease;margin-bottom:2px}
.node:hover{background:var(--bg-hover)}
.node.cur{background:var(--brand-soft);border-color:var(--brand-mid)}
.node.cur .nm{color:var(--brand);font-weight:500}
.node .dot{width:15px;height:15px;border-radius:50%;flex:0 0 auto;
  border:1.5px solid #CDD3DA;margin-top:2px;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:#fff;transition:border-color .15s,background .15s}
.node.done .dot{border-color:var(--success);background:var(--success)}
.node.cur .dot{border-color:var(--brand);background:var(--brand)}
.node .dot::after{content:"";width:5px;height:5px;border-radius:50%;background:#fff;
  opacity:0;transition:opacity .15s}
.node.cur .dot::after,.node.done .dot::after{opacity:1}
.node .nm{font-size:12px;color:var(--text-1);line-height:1.45}
.node .sub{font-size:10.5px;color:var(--text-3);line-height:1.4;margin-top:1px}

.statebox{margin-top:14px;padding:11px 13px;background:#fff;
  border:1px solid var(--border-card);border-radius:var(--r-field)}
.statebox .st{font-size:10.5px;color:var(--text-3);font-weight:500;
  letter-spacing:.4px;margin-bottom:7px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:11px;
  padding:2.5px 0}
.kv .k{color:var(--text-3)}
.kv .v{color:var(--text-1);font-family:ui-monospace,Menlo,Consolas,monospace;
  text-align:right;word-break:break-all}
.kv .v.on{color:#1D6B32}
.kv .v.off{color:var(--text-3)}

.netpick{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:7px}
.netpick button{
  font-size:11px;font-family:inherit;padding:6px 4px;border-radius:7px;
  border:1px solid var(--border-field);background:#fff;color:var(--text-2);
  cursor:pointer;transition:all .12s ease}
.netpick button:hover{background:var(--bg-hover)}
.netpick button.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* 认证方式那组是 6 档（1~6 种），两列会占三行，改三列两行 */
.netpick.mth{grid-template-columns:repeat(3,1fr)}

.tools{display:flex;gap:6px;margin-top:12px}
.tools button{
  flex:1;font-size:11.5px;font-family:inherit;padding:8px 6px;
  border-radius:8px;border:1px solid var(--border-field);background:#fff;
  color:var(--text-2);cursor:pointer;transition:all .12s ease}
.tools button:hover{background:var(--bg-hover);color:var(--text-1)}
.tools button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.tools button.pri:hover{background:var(--brand-hover)}

.log{margin-top:12px;max-height:150px;overflow-y:auto;
  background:#F7F8FA;border:1px solid var(--border-card);
  border-radius:var(--r-field);padding:9px 11px}
.log .li{font-size:10.5px;color:var(--text-2);line-height:1.6;
  padding:1.5px 0;font-family:ui-monospace,Menlo,Consolas,monospace;
  word-break:break-all}
.log .li b{color:var(--brand);font-weight:500}

/* 轨道折叠态 */
.shell.folded .rail{width:0;border-left:none}
.shell.folded .rail>*{display:none}
.rail-open{
  position:absolute;right:12px;top:38px;z-index:40;display:none;
  background:rgba(255,255,255,.94);border:.5px solid rgba(0,0,0,.12);
  border-radius:9px;padding:6px 11px;font-size:11.5px;color:var(--text-2);
  cursor:pointer;font-family:inherit;box-shadow:0 3px 12px rgba(0,0,0,.14)}
.shell.folded .rail-open{display:block}
.rail-open:hover{background:#fff;color:var(--text-1)}
/* 嵌入形态（v1.0.9）· 必须写在上面那条**之后** ——
   同为 2 个 class 的选择器，后写的赢；写前面会被 `.shell.folded .rail-open` 覆盖。
   这里再升一级到 3 个 class，彻底压住，避免以后有人调整顺序又踩回去。 */
html.embedded .shell.folded .rail-open{display:none}
/* 但 v1.0.13 起，交互说明页用 rail=1 让轨道展开 ——
   既然轨道能收起，就必须能再展开，所以 rail-on 时把这条按钮放回来。
   选择器升到 5 个 class，无论写在哪都压得住上面那条。 */
html.embedded.rail-on .shell.folded .rail-open{display:block}
html.embedded .tools{display:none}
html.embedded .notes,html.embedded .notes-mask{display:none!important}
/* 嵌入形态：iframe 视口比独立打开矮得多，Dock 是 absolute 不占流，
   .win 的 max-height:100% 会一路撑到容器底 → 底部按钮被 Dock 盖住。
   给桌面区补一条底部让位，窗口自己就收进来了。
   注意：不要再给 .win .body 加 padding —— 那会让窗口更高、max-height 收不下，
   反而把顶部品牌区裁掉（第一版就是这么错的）。 */
html.embedded .desk-wrap{padding-bottom:56px}
html.embedded .dock{bottom:8px}
/* 嵌入形态下窗口内容常比视口高，必须让滚动条可见 ——
   否则内部滚动是隐形的，研发会以为内容被裁掉了。 */
html.embedded .win .body{scrollbar-width:thin;scrollbar-color:#C9CDD3 transparent}
html.embedded .win .body::-webkit-scrollbar{width:7px}
html.embedded .win .body::-webkit-scrollbar-track{background:transparent}
html.embedded .win .body::-webkit-scrollbar-thumb{
  background:#C9CDD3;border-radius:4px}
html.embedded .win .body::-webkit-scrollbar-thumb:hover{background:#AEB5BF}

/* Toast */
.toast{
  position:absolute;bottom:78px;left:50%;transform:translateX(-50%);
  background:rgba(28,30,34,.92);color:#fff;font-size:12px;
  padding:9px 17px;border-radius:9px;z-index:60;
  animation:toastIn .22s cubic-bezier(.32,.72,0,1);white-space:nowrap;
  box-shadow:0 6px 22px rgba(0,0,0,.24)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}
  to{opacity:1;transform:translate(-50%,0)}}

/* 成功勾 */
.tickbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.tick{width:46px;height:46px;border-radius:50%;background:var(--success-soft);
  display:flex;align-items:center;justify-content:center;
  animation:pop .32s cubic-bezier(.32,.72,0,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.tickbox .tt{font-size:14px;font-weight:500}
.tickbox .ts{font-size:11.5px;color:var(--text-3)}

/* ============ 本页交互说明浮层（v1.0.12）============
   与左侧流程轨道同源不同职：
     流程轨道 = 整条流程的节点地图（跳到某一步）
     本页说明 = 眼下这一屏有哪些交互点（对照着做）
   形态：右侧滑出浮层，盖在桌面之上，不占布局宽度。
   样式上刻意与轨道区分：轨道是浅灰底，说明浮层用纯白底 + 左缘投影，
   并给每条交互点一个蓝色 ID 标签，方便与交互表/PRD 对照。 */
/* v1.0.12：改成右侧滑出的浮层 —— 不再占布局宽度。
   之前是 .shell 的第三个 flex 成员，三栏并存时桌面区被压扁，
   里面的模拟 macOS 窗口跟着缩，原型就不像原型了。
   现在 position:fixed 脱离文档流，桌面区宽度恒定，说明浮在上面。 */
.notes{
  position:fixed;top:0;right:0;bottom:0;z-index:52;
  width:380px;max-width:88vw;
  background:#fff;border-left:1px solid var(--border-card);
  box-shadow:-10px 0 34px rgba(16,18,22,.10);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(100%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);
  will-change:transform}
.notes.open{transform:translateX(0)}

/* 遮罩：只用来接「点外部关闭」，颜色极淡 —— 原型不该因为看说明而变暗 */
.notes-mask{
  position:fixed;inset:0;z-index:51;background:transparent;
  display:none}
.notes-mask.open{display:block}
.notes-h{padding:14px 16px 12px;border-bottom:1px solid var(--border-card);
  display:flex;align-items:flex-start;gap:8px}
.notes-h .t{flex:1;min-width:0}
.notes-h h2{font-size:13px;font-weight:500}
.notes-h p{font-size:11px;color:var(--text-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes-h .fold{
  background:none;border:none;cursor:pointer;color:var(--text-3);
  font-size:13px;line-height:1;padding:3px 5px;font-family:inherit;border-radius:6px}
.notes-h .fold:hover{color:var(--text-1);background:var(--bg-hover)}

.notes-b{flex:1;overflow-y:auto;padding:10px 12px 20px}
.notes-b::-webkit-scrollbar{width:6px}
.notes-b::-webkit-scrollbar-thumb{background:#D8DCE2;border-radius:3px}

/* 界面定位：这一屏是干嘛的 */
.notes-desc{
  font-size:11.5px;line-height:1.62;color:var(--text-2);
  background:var(--brand-soft);border-radius:8px;padding:9px 11px;margin-bottom:10px}
.notes-desc b{color:var(--brand);font-weight:500}

/* 一条交互点 */
.np{border:1px solid var(--border-card);border-radius:9px;margin-bottom:7px;overflow:hidden}
.np-h{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;cursor:pointer}
.np-h:hover{background:var(--bg-hover)}
.np-h .arw{font-size:8px;color:var(--text-3);margin-top:4px;flex:0 0 auto;
  transition:transform .15s}
.np.open .np-h .arw{transform:rotate(90deg)}
.np-h .tx{flex:1;min-width:0}
.np-h .id{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;
  color:var(--brand);background:var(--brand-soft);padding:1px 5px;
  border-radius:5px;display:inline-block;margin-bottom:3px}
.np-h .do{font-size:11.5px;line-height:1.5;color:var(--text-1)}
.np-b{display:none;padding:0 10px 10px 24px}
.np.open .np-b{display:block}
.np-r{display:flex;gap:7px;padding:5px 0;border-top:1px solid #F2F3F5}
.np-r .k{flex:0 0 52px;font-size:10.5px;color:var(--text-3);padding-top:1px}
.np-r .v{flex:1;min-width:0;font-size:11px;line-height:1.6;color:var(--text-2)}
.np-r .v.q{color:var(--text-1)}
.np-r .v .ok{color:#248A3D}
.np-r .v .er{color:#B3261E}
.np-r .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}
.notes-empty{font-size:11.5px;color:var(--text-3);padding:14px 4px;line-height:1.7}
@media (max-width:720px){.notes{width:100%;max-width:100%}}

<script>
/* =========================================================
   E 登录 Mac 版 · 联动原型
   一个状态机 + 一组渲染函数，界面切换靠重渲染，不靠跳页
   ========================================================= */

var S = {
  bind: false,          // 是否已绑定 IAM 账号
  login: false,         // 是否已登录（IAM 会话）
  view: 'bind',         // 当前界面
  method: 'pw',         // 登录方式 pw|qr|sms|otp
  user: '',             // 上次登录的统一身份账号（只用于「您好，XXX」回显）

  /* ── 三个「账号」字段，各司其职，禁止互相代替（v1.0.8）───────────
     以前只有一个 osUser，既当「本机 macOS 账户名」用（绑定页那行只读展示），
     又当「绑定记录里的统一身份账号」用（退出页比对 / 档案返显 / 注销文案），
     而它本身还是个**写死的常量** —— 于是无论用户绑了谁，
     退出后登录页都声称「本机已绑定账号：zhangsan」。这就是本轮要修的病根。

     macUser  本机 macOS 账户名。系统给的值（真实环境 = NSUserName() / whoami），
              只读，任何业务逻辑都不许改写它。
     bindIam  本机绑定记录里的统一身份账号 ——「本机已绑定账号」的唯一真相来源。
              写入点唯一：绑定成功那一刻（commitBind）；
              清空点唯一：注销成功那一刻（commitUnbind）。
              初始为空 = 这台机器上还没有绑定记录。
     user     上次登录的统一身份账号，只喂「您好，XXX」。
              退出登录**不清**（要回显），注销才清。

     注意 macUser 与 bindIam 是两回事：设备转交后新员工用的是自己的 macOS 账户，
     但机器上的绑定记录还留着原员工的 IAM 账号 ——「原绑定用户离职」这条死锁正是这么来的。 */
  macUser: 'zhangsan',  // 本机 macOS 账户名（模拟 whoami，只读）
  bindIam: '',          // 本机绑定记录：统一身份账号（唯一写入口见 commitBind）
  device: 'MacBook Pro',
  net: 'ok',            // ok|weak|off|re
  lang: 'zh',           // 界面语言 zh|en
  modal: null,          // 当前弹窗
  winOpen: true,        // 窗口是否展开（关闭/最小化后为 false）
  winMax: false,        // 窗口是否最大化

  /* ── v1.0.16 认证链（改密 / 二次验证）─────────────────────────
     enabled   后台开通了哪几种认证方式。真实客户端由后台下发，原型在这里模拟，
               用来演示「配 6 种」和「只配 2 种」两种排布。
     step      窗口内的推进步骤。null = 正常登录表单；'chpw' = 正在改密。
               改密与二次验证都是**整页替换窗口内容**，不是盖一层蒙层。
     chpw      改密上下文：{ reason:'initial'|'expired'|'soon' }，决定标题与能否跳过。
     second    二次验证上下文：{ cur:'sms'|'otp'|'pw'|'face'|'fp', err }。
               非空即表示当前整页显示的是二次验证页，不新开窗口。 */
  enabled: ['pw','qr','sms','face','fp','otp'],
  step: null,
  chpw: null,
  second: null,
  /*    demo      演示开关。真实环境这些值全由后台策略决定，原型用开关模拟，
               免得为了看一条分支去改代码。
                 pwdState    正常 / 初始密码 / 已过期 / 即将过期
                 second      二次验证开不开
                 secondWays  策略允许的二次验证方式（默认给全，验证页里可切） */
  demo: { pwdState:'normal', second:false,
          pwdDays:3,
          secondWays:['sms','face','fp','otp'], secondWay:'sms' },

  data: {},             // 表单暂存
  log: []
};


/* =========================================================
   本页交互说明的数据（v1.0.11）
   NOTES        —— 72 条交互点全文，来自《交互表 v1.0》
   NODE_POINTS  —— 每个界面列出哪些交互点（界面级索引）
   NODE_DESC    —— 每个界面的一句话定位
   这三个都由 _过程产物/r31/ 的脚本从交互表导出，改表后重跑即可同步，

/* ---------- 本页交互说明（v1.0.12：右侧滑出浮层）---------- */
var notesOpen = false;

function setNotes(open){
  notesOpen = !!open;
  var el = document.getElementById('notes');
  var mk = document.getElementById('notesMask');
  if(el) el.classList.toggle('open', notesOpen);
  if(mk) mk.classList.toggle('open', notesOpen);
  var b = document.getElementById('btnNotes');
  if(b){ b.classList.toggle('on', notesOpen); b.textContent = notesOpen ? '收起说明' : '本页交互说明'; }
  if(notesOpen) renderNotes();
}

function toggleNotes(){ setNotes(!notesOpen); }
function closeNotes(){ if(notesOpen) setNotes(false); }

/* Esc 关闭说明浮层。
   优先级排在模态框之后 —— 有模态框时 Esc 应该先关模态框（原型里模态框另有关闭按钮，
   这里只保证不会「一次 Esc 把两层一起关掉」）。 */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape' && e.keyCode !== 27) return;
  if(!notesOpen) return;
  if(S.modal) return;
  closeNotes();
});

/* 当前界面在 NODE_POINTS 里的键。
   panel / panel-off 是同一个界面的两态（登录/未登录），
   说明都归到 panel —— 登录态判定不该影响「这屏能做什么」的清单。 */
function notesKey(){
  /* 改密页与二次验证页是"整页替换窗口内容"的步骤页，S.view 仍是 bind / loginagain，
     但它们的交互点是另一套 —— 按步骤优先，才能看到那 18 条而不是宿主页的清单 */
  if(S.step === 'chpw') return 'chpw';
  if(S.second) return 'second';
  var v = S.view;
  if(v === 'panel-off') v = 'panel';
  return v;
}

function renderNotes(){
  var body = document.getElementById('notesBody');
  if(!body) return;
  var key = notesKey();
  var ids = NODE_POINTS[key] || [];

  /* 标题副文案：这一屏是干嘛的 */
  var sub = document.getElementById('notesSub');

  if(!ids.length){
    if(sub) sub.textContent = curName();
    body.innerHTML = '<div class="notes-empty">这个界面还没有登记交互点。<br>' +
      '（如属遗漏，请在《E登录_Mac版_交互表》补一行，再重跑导出脚本）</div>';
    return;
  }

  if(sub) sub.textContent = curName() + ' · 共 ' + ids.length + ' 条';

  var html = '';
  if(NODE_DESC[key]){
    html += '<div class="notes-desc"><b>这一屏</b>：' + NODE_DESC[key] + '</div>';
  }

  ids.forEach(function(id){
    var n = NOTES[id];
    if(!n) return;
    var rows = '';
    if(n.do) rows += '<div class="np-r"><span class="k">触发</span>' +
      '<span class="v q">' + esc(n.do) + '</span></div>';
    if(n.ok) rows += '<div class="np-r"><span class="k">预期</span>' +
      '<span class="v"><span class="ok">&#10003;</span> ' + esc(n.ok) + '</span></div>';
    if(n.err && n.err !== '无') rows += '<div class="np-r"><span class="k">异常</span>' +
      '<span class="v"><span class="er">!</span> ' + esc(n.err) + '</span></div>';
    if(n.copy) rows += '<div class="np-r"><span class="k">提示语</span>' +
      '<span class="v mono">「' + esc(n.copy) + '」</span></div>';
    if(n.page) rows += '<div class="np-r"><span class="k">页面</span>' +
      '<span class="v">' + esc(n.page) + '</span></div>';

    html += '<div class="np" data-id="' + id + '">' +
      '<div class="np-h"><span class="arw">&#9654;</span><div class="tx">' +
        '<span class="id">' + id + '</span>' +
        '<div class="do">' + esc(n.do) + '</div>' +
      '</div></div>' +
      '<div class="np-b">' + rows + '</div>' +
    '</div>';
  });

  body.innerHTML = html;
  body.scrollTop = 0;
}

/* 说明栏里点标题展开/收起该条。
   委托到 document 而不是 notesBody 本身 —— 浮层 DOM 在 </body> 前，
   比这段 script 靠后，若直接绑元素会拿到 null 并在顶层抛错，
   把 script 后续所有 var 赋值一起带走。 */
document.addEventListener('click', function(e){
  var hd = e.target.closest && e.target.closest('#notesBody .np-h');
  if(hd) hd.parentNode.classList.toggle('open');
});


/* ---------- 工具 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function logIt(t){
  var d=new Date(); var hh=String(d.getHours()).padStart(2,'0');
  var mm=String(d.getMinutes()).padStart(2,'0'); var ss=String(d.getSeconds()).padStart(2,'0');
  S.log.unshift('<b>'+hh+':'+mm+':'+ss+'</b> '+t);
  if(S.log.length>60) S.log.pop();
}

function toast(msg){

}

var NETCFG = {
  weak:{ cls:'net-weak', txt:'当前网络较弱，操作可能较慢' },
  off: { cls:'net-off',  txt:'网络已断开，请检查网络连接' },
  re:  { cls:'net-re',   txt:'正在重新连接…' },
  ok:  { cls:'net-ok',   txt:'网络已恢复' }
};
function netIcon(color){
  return '<svg width="13" height="13" viewBox="0 0 13 13" fill="none">'+
    '<path d="M1.6 5.2C3 3.9 4.7 3.2 6.5 3.2s3.5.7 4.9 2" stroke="'+color+'" stroke-width="1.2" stroke-linecap="round"/>'+
    '<path d="M3.6 7.4c.9-.8 1.9-1.2 2.9-1.2s2 .4 2.9 1.2" stroke="'+color+'" stroke-width="1.2" stroke-linecap="round"/>'+
    '<path d="M2.6 11.4l7.8-9.4" stroke="'+color+'" stroke-width="1.4" stroke-linecap="round"/></svg>';
}
function netBar(){
  if(S.net==='ok') return '';
  var c=NETCFG[S.net];
  var col = S.net==='off' ? '#A32620' : S.net==='weak' ? '#8A4B00' : '#0C447C';
  var retry = S.net==='off' ? '<button class="retry" onclick="doReconnect()">重试</button>' : '';
  return '<div class="netbar '+c.cls+'">'+netIcon(col)+esc(c.txt)+retry+'</div>';
}
function doReconnect(){
  S.net='re'; logIt('点【重试】，进入重连'); render();
  setTimeout(function(){ S.net='ok'; logIt('网络已恢复');
    render(); setTimeout(function(){ if(S.net==='ok'){ S.net='ok'; } render(); },2000); }, 1300);
}

/* 长键先替换：否则「设置」会先把「设置页」这类长词拆坏。
   同长度保持声明序（现代浏览器 sort 稳定）。 */
var EN_KEYS = Object.keys(EN).sort(function(a, b){ return b.length - a.length; });

function loc(str){
  if(S.lang !== 'en' || !str) return str;
  var out = String(str), i, k;
  for(i = 0; i < EN_KEYS.length; i++){
    k = EN_KEYS[i];
    if(out.indexOf(k) >= 0) out = out.split(k).join(EN[k]);
  }
  return out;
}

/* 只替换文本节点，不碰标签与属性 —— 保护 JS 维护的 class / id / on*
   注意：改写是不可逆的，所以要把原文挂在节点上缓存一份，
   否则切回中文时静态外壳（菜单栏 / 流程轨道）会卡在英文回不来。
   节点被 textContent= 或 innerHTML= 换掉时缓存会自然失效，不用手动清。 */
function locEl(root){
  if(!root) return;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  var n, list = [];
  while((n = w.nextNode())){ if(n.nodeValue && n.nodeValue.trim()) list.push(n); }
  for(var i = 0; i < list.length; i++){
    var t = list[i];
    if(t.__zh === undefined) t.__zh = t.nodeValue;
    t.nodeValue = (S.lang === 'en') ? loc(t.__zh) : t.__zh;
  }
}

function localizeChrome(){
  var root = document.getElementById('shell');
  locEl(root);
  /* title 是属性，locEl 碰不到 —— 菜单栏图标 / Dock 图标 / 收起按钮靠它，同样要缓存原文 */
  var ts = root.querySelectorAll('[title]');
  for(var i = 0; i < ts.length; i++){
    var e = ts[i];
    if(e.__zhTitle === undefined) e.__zhTitle = e.title;
    e.title = (S.lang === 'en') ? loc(e.__zhTitle) : e.__zhTitle;
  }
}

/* 切换界面语言（设置页「语言切换」分段控件调它） */
function setLang(l){
  if(S.lang === l) return;
  S.lang = l;
  logIt('界面语言切换为 ' + (l === 'en' ? 'English' : '中文'));
  render();
  toast(l === 'en' ? 'Language switched to English' : '界面语言已切换为中文');
}

/* ---------- 渲染 ---------- */
function render(){
  renderDesk();
  renderMenuBar();
  renderRail();
  renderState();
  localizeChrome();
  /* v1.0.11：切界面时同步刷新「本页交互说明」。
     只在面板展开时刷新 —— 收起时刷了也没人看，白跑一遍 DOM。 */
  if(notesOpen) renderNotes();
}

function renderMenuBar(){
  var img=document.getElementById('mbElogonImg');
  document.getElementById('mbElogon').style.display = S.bind ? 'flex' : 'none';
  if(S.bind){
    img.src = S.login ? 'assets/logo-color-128.png' : 'assets/logo-mono-black-128.png';
    img.style.opacity = S.login ? '1' : '.35';
    img.alt = S.login ? 'E登录 已登录' : 'E登录 未登录';
  }
  var nm=document.getElementById('mbAppName');
  nm.textContent = (S.view==='apps') ? '浏览器' : (S.view==='settings') ? 'E 登录' : '访达';
}

function netBannerInBody(){ return ''; }

function renderDesk(){
  var d=document.getElementById('desk');
  var h='';

  function winOpen(title, inner, cls){
    return '<div class="win '+(cls||'')+(S.winMax?' maxed':'')+'">'+
      '<div class="titlebar" onmousedown="dragWinStart(event)">'+

          '<i class="lt-close" onclick="winClose(event)" title="关闭"></i>'+
          '<i class="lt-min" onclick="winMin(event)" title="最小化"></i>'+
          '<i class="lt-max" onclick="winMax(event)" title="最大化"></i>'+
        '</div>'+

  }

  switch(S.view){

  /* ===== 绑定引导窗口 ===== */
  case 'bind': case 'bind-err': {
    /* v1.0.16：改密是认证链里的一步，就地替换窗口内容，不新开窗口、不跳页 */
    if(S.step === 'chpw'){ h += winOpen('E 登录', chpwBody(), 'auth'); break; }
    /* v1.0.17：二次验证同样是整页切换 —— 与改密、与登录表单一套版式，不是弹层 */
    if(S.second){ h += winOpen('E 登录', secondPage(), 'auth'); break; }
    var err = S.view==='bind-err';
    h += winOpen('E 登录',
      '<div class="body">'+
        '<div class="brand">'+
          '<div class="logo-box"><img src="assets/logo-color-128.png"'+
          ' width="42" height="42" alt="E登录" /></div>'+
          '<h1>首次登录</h1>'+
          '<p>请将您的统一身份账号与本机账号关联</p></div>'+
        loginTabs()+
        loginForm(err)+
        osField()+
        (err ? errBlock(S.data.errMsg||'该统一身份账号已被其他终端绑定') : '')+
        ((S.method==='face'||S.method==='fp')
          ? bioCta(S.method, bioSt(S.method), '绑定并登录', 'doBind()', S.net==='off')
          : '<button class="btn btn-primary btn-block"'+
            ((S.net==='off' || !bindReady())?' disabled':'')+
            ' onclick="doBind()">绑定并登录</button>')+
      '</div>', 'auth');
    break;
  }

  /* ===== 菜单栏面板 ===== */
  case 'panel': {
    h += '<div class="pop">'+
      '<div class="bindrow">'+
        '<div class="avatar">'+esc(S.user? S.user.charAt(0).toUpperCase():'—')+'</div>'+
        '<div class="meta"><div class="hi">您好，'+esc(S.user||'—')+'</div>'+
        '<div class="id">已绑定本机 · '+esc(S.device)+'</div></div>'+
        '<span class="badge-ok">已登录</span>'+
      '</div>'+
      '<div class="sep"></div>'+
      '<button class="mi" onclick="go(\'apps\')">'+
        '<span class="ico">'+icoGrid('#6B7280')+'</span>'+
        '<span class="txt">访问应用门户</span><span class="spacer"></span>'+
        '<span class="badge">12</span></button>'+
      '<button class="mi" onclick="go(\'settings\')">'+
        '<span class="ico">'+icoGear()+'</span><span class="txt">设置</span></button>'+
      '<button class="mi danger" onclick="askCancel()">'+
        '<span class="ico">'+icoBan()+'</span>'+
        '<span class="txt">注销绑定账号</span></button>'+
      '<div class="sep"></div>'+
      '<button class="mi danger" onclick="askExit()">'+
        '<span class="ico">'+icoOut()+'</span>'+
        '<span class="txt">退出登录</span></button>'+
    '</div>';
    break;
  }

  /* ===== 未登录面板 ===== */
  case 'panel-off': {
    h += '<div class="pop">'+
      '<div class="bindrow">'+
        '<div class="avatar" style="background:#C9CDD3">'+
          '<svg width="15" height="15" viewBox="0 0 15 15" fill="none">'+
          '<circle cx="7.5" cy="5.4" r="2.6" stroke="#fff" stroke-width="1.4"/>'+
          '<path d="M2.6 13c0-2.3 2.2-3.6 4.9-3.6s4.9 1.3 4.9 3.6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>'+
          '</svg></div>'+
        '<div class="meta"><div class="hi" style="color:#6B7280">'+
        (S.bindIam? '未登录' : '尚未关联')+'</div>'+
        '<div class="id">'+(S.bindIam
          ? '已绑定 '+esc(S.bindIam)+'，可一键登录'
          : '本机还没有关联统一身份账号')+'</div></div>'+
      '</div>'+
      '<div class="sep"></div>'+
      /* v1.0.10 分流：这个面板同时服务两种场景，去向必须不同 ——
         有绑定记录 → 进登录页（可一键登录）
         无绑定记录 → 进绑定引导页（首次关联；若去登录页，页面会说「您好，」而无人可问候） */
      (S.bindIam
        ? '<button class="mi" onclick="go(\'loginagain\')">'+
            '<span class="ico">'+icoOut('#6B7280')+'</span>'+
            '<span class="txt">登录统一身份</span><span class="spacer"></span>'+
            '<span class="badge">1</span></button>'
        : '<button class="mi" onclick="go(\'bind\')">'+
            '<span class="ico">'+icoOut('#6B7280')+'</span>'+
            '<span class="txt">关联统一身份账号</span><span class="spacer"></span>'+
            '<span class="badge">1</span></button>')+
      '<button class="mi" onclick="go(\'settings\')">'+
        '<span class="ico">'+icoGear()+'</span><span class="txt">设置</span></button>'+
    '</div>';
    break;
  }

  /* ===== 应用门户 ===== */
  case 'apps': {
    var apps=[['OA 办公','#007AFF','O'],['邮件系统','#34C759','M'],
      ['人事系统','#FF9500','H'],['财务报销','#AF52DE','F'],
      ['项目管理','#FF3B30','P'],['知识库','#5AC8FA','K'],
      ['数据平台','#5856D6','D'],['工单系统','#FF2D55','T']];
    var grid=apps.map(function(a){
      return '<div class="app" onclick="openApp(\''+a[0]+'\')">'+
        '<div class="sq" style="background:'+a[1]+'">'+a[2]+'</div>'+
        '<div class="nm">'+a[0]+'</div></div>'; }).join('');
    h += winOpen('E 登录 · 应用门户',
      '<div class="urlbar"><div class="pill">'+
        '<svg width="9" height="11" viewBox="0 0 9 11" fill="none">'+
        '<rect x="1" y="4.6" width="7" height="5.4" rx="1.3" stroke="#9CA3AF" stroke-width="1"/>'+
        '<path d="M2.8 4.6V3.2a1.7 1.7 0 013.4 0v1.4" stroke="#9CA3AF" stroke-width="1"/></svg>'+
        'sso.company.com/portal</div></div>'+
      '<div class="apps">'+grid+'</div>'+
      '<div style="padding:0 20px 18px"><div class="sso">'+
        '<svg width="12" height="12" viewBox="0 0 12 12" fill="none">'+
        '<circle cx="6" cy="6" r="5" stroke="#1D6B32" stroke-width="1.3"/>'+
        '<path d="M3.6 6.1l1.7 1.7 3.1-3.4" stroke="#1D6B32" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        '已通过统一身份单点登录，无需再次输入密码</div></div>', 'browser');
    break;
  }

  /* ===== 设置 ===== */
  case 'settings': {
    h += winOpen('设置',
      '<div class="body" style="gap:11px">'+
        row('语言切换','切换需要使用的语言',
          '<div class="seg">'+
            '<span class="'+(S.lang==='zh'?'on':'')+'" onclick="setLang(\'zh\')">中文</span>'+
            '<span class="'+(S.lang==='en'?'on':'')+'" onclick="setLang(\'en\')">EN</span>'+
          '</div>', icoLang())+
        row('开机自动启动','登录 macOS 后自动运行并按绑定关系登录',
          sw('swBoot', true), icoPower())+
        '<div class="divider"></div>'+
        row('自动打开应用门户','登录成功后自动展开门户界面',
          sw('swPortal', true), icoGrid('#6B7280'))+
        row('登录成功后关闭窗口','收起客户端窗口，转为后台保持在线',
          sw('swClose', false), icoMin())+
        '<div class="divider"></div>'+
        '<div class="groupname">关于</div>'+
        '<div class="about">'+
          '<img src="assets/logo-color-128.png" alt="E登录" />'+
          '<div class="txt"><div class="n">Elogon</div>'+
          '<div class="v">V1.8.4.2.021301</div></div>'+
          '<button class="btn btn-secondary" style="height:28px;font-size:11.5px"'+
          ' onclick="toast(\'已是最新版本\')">检查更新</button>'+
        '</div>'+
      '</div>');
    break;
  }

  /* ===== 退出后登录页 ===== */
  case 'loginagain': case 'forgot': {
    if(S.view==='loginagain'){
      /* 改密页在退出后登录页同样就地把表单顶掉 —— 两个入口共用同一个认证链 */
      if(S.step === 'chpw'){ h += winOpen('E 登录', chpwBody(), 'auth'); break; }
      if(S.second){ h += winOpen('E 登录', secondPage(), 'auth'); break; }
      var lerr = !!S.data.loginErr;
      h += winOpen('E 登录',
        '<div class="body">'+
          '<div class="brand">'+
            '<div class="logo-box"><img src="assets/logo-color-128.png"'+
            ' width="42" height="42" alt="E登录" /></div>'+
            '<h1>您好，'+esc(S.user)+'</h1></div>'+
          loginTabs()+
          loginForm(lerr)+
          (lerr ? errBlock(S.data.loginErr) : '')+
          ((S.method==='face'||S.method==='fp')
            ? bioCta(S.method, bioSt(S.method), '登录', 'doLogin()', S.net==='off')
            : '<button class="btn btn-primary btn-block"'+
              ((S.net==='off' || !bindReady())?' disabled':'')+
              ' onclick="doLogin()">登录</button>')+
          '<div class="footrow">'+
            (S.data.canUnbind
              ? '<button class="lnk danger" onclick="askCancelFromLock()">'+
                '注销绑定账号</button>' : '')+
            '<button class="lnk" onclick="go(\'forgot\')">忘记密码</button>'+
          '</div>'+
        '</div>', 'auth');
    } else {
      h += winOpen('E 登录',
        '<div class="body" style="gap:11px">'+
          forgotPage()+
        '</div>');
    }
    break;
  }

  /* ===== 注销完成 → 回空白绑定页 ===== */
  case 'cancel3': {
    h += winOpen('E 登录',
      '<div class="body">'+
        '<div class="tickbox"><div class="tick">'+
          '<svg width="24" height="24" viewBox="0 0 24 24" fill="none">'+
          '<path d="M5.5 12.4l4.4 4.4 8.6-9.2" stroke="#34C759" stroke-width="2.2"'+
          ' stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
          '<div class="tt">注销成功</div>'+
          '<div class="ts">绑定关系已解除，请重新关联账号</div></div>'+
        '<div class="divider"></div>'+
        '<div class="brand"><img src="assets/logo-color-128.png" width="40" height="40" alt="E登录" />'+
        '<h1 style="font-size:14px">关联统一身份账号</h1></div>'+
        '<button class="btn btn-primary btn-block" onclick="go(\'bind\')">去关联</button>'+
      '</div>');
    break;
  }

  /* ===== 桌面空白：窗口已关闭，等待从 Dock 或菜单栏唤起 ===== */
  case 'deskblank': {
    h += '<div class="deskblank-tip">'+
      '<div class="dbi"><img src="assets/logo-color-128.png" width="34" height="34" alt="E登录" /></div>'+
      '<div class="dbt">窗口已关闭</div>'+
      '<div class="dbs">点下方 Dock 中的 E 登录图标，可重新打开</div>'+
      '<button class="btn btn-primary" onclick="reopenWin()">重新打开窗口</button>'+
    '</div>';
    break;
  }
  }

  /* ===== 弹窗 ===== */
  if(S.modal==='exit'){
    h += '<div class="overlay"><div class="dialog"><div class="dbody">'+
      '<h3>确定要退出登录吗？</h3>'+
      '<p>退出后需重新登录，绑定关系将保留。</p>'+
      '<div class="acts">'+
        '<button class="btn btn-secondary" onclick="closeModal()">取消</button>'+
        '<button class="btn btn-primary" onclick="doExit()">确定</button></div>'+
      '</div></div></div>';
  }
  if(S.modal==='cancel'){
    /* fromLock：从「认证失败」态发起的解绑（原绑定用户可能已离职，走这条路）。
       两条路径的差异只在措辞，以及要不要再验一次密码。 */
    var fromLock=(S.data.cancelFrom==='lock');
    h += '<div class="overlay"><div class="dialog"><div class="dbody">'+
      '<h3>确定要注销绑定账号吗？</h3>'+
      '<p>'+(fromLock
        ? '本机当前绑定的是「'+esc(S.bindIam||'—')+'」。你已通过统一身份认证，'+
          '注销后绑定关系将解除，可直接重新关联你自己的账号。'
        : '注销后，本机账号与统一身份账号的绑定关系将解除，需重新绑定后才能自动登录。')+'</p>'+
      '<div class="acts">'+
        '<button class="btn btn-secondary" onclick="closeModal()">取消</button>'+
        /* 死锁路径不再经过「输密码」那一步：本机绑的是别人的账号，
           新用户根本不知道那个密码，弹出来只会让人以为走不下去 ——
           而且 doCancel() 在 lock 路径下压根不校验这个字段，
           等于问了一个不用回答的问题。确认即解绑。 */
        '<button class="btn btn-primary" onclick="'+
          (fromLock ? 'doCancel()' : 'toCancel2()')+'">确认注销</button></div>'+
      '</div></div></div>';
  }
  if(S.modal==='cancel2'){
    h += '<div class="overlay"><div class="dialog"><div class="dbody">'+
      '<h3>注销绑定账号</h3>'+
      '<p>请输入当前账号密码以确认注销</p>'+
      '<div class="field"><label>密码</label>'+
      '<input class="input" type="password" id="cancelPw" placeholder="请输入当前密码"'+
      ' onkeydown="if(event.key===\'Enter\')doCancel()" /></div>'+
      (S.data.cancelErr ? errBlock(S.data.cancelErr) : '')+
      '<div class="acts">'+
        '<button class="btn btn-secondary" onclick="closeModal()">返回</button>'+
        '<button class="btn btn-primary" onclick="doCancel()">确认注销</button></div>'+
      '</div></div></div>';
  }

  d.innerHTML = loc(h);
}

/* =========================================================
   v1.0.16 · 认证方式注册表
   一次定义，三处共用：首因素切换条、二次验证页、日志里的中文名。
   以前每个函数里各写一遍 ['pw','qr','sms','otp'] 和一张中文名映射表，
   加两种方式要改四五处，漏一处就出现「切换成功但界面没变」这种鬼问题。

   两个字段的差别要分清：
     sec:false —— 只能当首因素，不能拿来当二次验证（扫码）。
     bio:true  —— 生物识别。首因素用过它，二次验证就不再给同一个，
                  同一个器官验两次等于没验。
   ========================================================= */
var METHODS = [
  { id:'pw',   nm:'账密', ic:icoLock,   ai:'账密登录', sec:true,  bio:false },
  { id:'qr',   nm:'扫码', ic:icoQr,     ai:'扫码登录', sec:false, bio:false },
  { id:'sms',  nm:'短信', ic:icoPhone,  ai:'短信登录', sec:true,  bio:false },
  { id:'face', nm:'人脸', ic:icoFace,   ai:'人脸识别', sec:true,  bio:true  },
  { id:'fp',   nm:'指纹', ic:icoFinger, ai:'指纹识别', sec:true,  bio:true  },
  { id:'otp',  nm:'口令', ic:icoKey,    ai:'动态口令', sec:true,  bio:false }
];

/* 演示用：后台开通 1~6 种时的组合。
   顺序不是 METHODS 的展示顺序，而是「客户实际会怎么分期开通」：
   账密打底 → 加短信 → 加扫码 → 加口令 → 加人脸 → 加指纹。
   这样每一种都能单独看到「少开一种时 tab 怎么排」，而不是只有全开和两格两档。
   注意：tab 条本身仍按 METHODS 顺序渲染，所以新加的方式不一定出现在最右边 ——
   那是故意的，后台下发的是「集合」，客户端不该因为顺序不同就换位置。 */
var MTH_PRESETS = {
  '1': ['pw'],
  '2': ['pw','sms'],
  '3': ['pw','sms','qr'],
  '4': ['pw','sms','qr','otp'],
  '5': ['pw','sms','qr','otp','face'],
  '6': ['pw','sms','qr','otp','face','fp']
};
function methodById(id){
  for(var i=0;i<METHODS.length;i++){ if(METHODS[i].id===id) return METHODS[i]; }
  return METHODS[0];
}
/* 当前可用的方式。真实客户端由后台下发「已开通 ∩ 已绑定」，
   原型用 S.enabled 模拟后台配置，默认 6 种全开。 */

  var on = S.enabled || METHODS.map(function(m){ return m.id; });

function loginTabs(){
  /* v1.0.16：由 METHODS + 后台配置渲染，不再写死 4 项。

     与 Windows 版「只渲染可用认证方式」的口径一致。 */
  var list = enabledMethods();
  /* 只开通了一种 / 一种都没开通时不留切换条 ——
     一颗 tab 没有「切换」的含义，占着一条反而像坏了两格。

  if(list.length <= 1) return '';
  return '<div class="tabs">'+list.map(function(it){

      '" title="'+esc(it.ai)+'"'+
      ' onclick="setMethod(\''+it.id+'\')">'+it.ic()+
      '<span>'+esc(it.nm)+'</span></button>'; }).join('')+'</div>';
}

  return '<div class="'+cls+'">'+
    '<span class="lead">'+ico+'</span>'+

      (o.ro ? ' readonly' : '')+

    (o.info ? '<button class="info" type="button" tabindex="-1" aria-label="密码要求"'+

  var show = (el.type === 'password');

  btn.innerHTML = show ? icoEyeOff() : icoEye();

/* 采集区主体（首因素与二次验证共用），只吃 kind 与状态 */
function bioCore(kind, st){
  st = st || 'idle';
  var isFace = (kind === 'face');
  var cls = st==='busy' ? 'busy' : (st==='ok' ? 'ok' : '');
  var stText = st==='busy' ? (isFace ? '正在识别，请保持面向屏幕' : '正在比对指纹…')
             : st==='ok'   ? (isFace ? '人脸识别通过' : '指纹校验通过')
             : (isFace ? '请将面部置于取景框内' : '请将手指放在 Touch ID 上');

  var core = isFace
    ? '<div class="maskwrap '+cls+'">'+ personSilhouette()+
        (st==='busy' ? '<i class="scanline"></i>' : '')+
        (st==='ok' ? '<div class="okmark">'+biotick()+'</div>' : '')+
      '</div>'
    : '<div class="fpbig '+cls+'">'+ fpBig()+
        (st==='ok' ? '<div class="okmark">'+biotick()+'</div>' : '')+
      '</div>';

  var tips = isFace
    ? '<div class="biotips'+(st==='ok'?' gone':'')+'">'+
        '<div class="tip">'+icoSun()+'<span>保持光线充足</span></div>'+
        '<div class="tip">'+icoScanFrame()+'<span>脸在取景框内</span></div>'+
        '<div class="tip">'+icoFaceFront()+'<span>面部正对屏幕</span></div>'+
      '</div>'
    : '';

  /* 通过之后取景提示就没用了 —— 收起但保留占位，
     否则成功那一刻窗口会矮一截，看着像闪了一下。 */
  return core+
    '<div class="ttl">'+esc(stText)+'</div>'+
    tips;
}

/* 人脸 / 指纹页的主按钮：一个按钮走完全程。
   未识别时是「开始人脸识别」，识别中是禁用态，通过后才变成真正的
   「登录 / 绑定并登录 / 验证」。参考图本身就是一颗大按钮，两段式更贴。 */
function bioCta(kind, st, label, action, off, fn){
  fn = fn || 'simBio';
  if(st === 'busy'){
    return '<button class="btn btn-primary btn-block" disabled>识别中…</button>';
  }
  if(st === 'ok'){
    return '<button class="btn btn-primary btn-block"'+(off?' disabled':'')+
      ' onclick="'+action+'">'+label+'</button>';
  }
  return '<button class="btn btn-primary btn-block" onclick="'+fn+'(\''+kind+'\')">'+
    (kind==='face' ? '开始人脸识别' : '开始指纹校验')+'</button>';
}

  return '<div class="bio2">'+bioCore(kind, st)+'</div>';
}
/* 取某个方式当前的识别状态（渲染时算 CTA 用） */
function bioSt(kind){
  var b = S.data.bio || {};

}

/* 模拟生物识别：调起 → 采集中 → 比对通过。真实客户端在这 1 秒里做两件事：
   ① 授权 SDK 拿到采集结果；② 把结果交第三方引擎比对，拿回 是/否。 */
var bioTimer=null;
function simBio(kind){
  clearTimeout(bioTimer);
  S.data.bio = { kind:kind, st:'busy' };
  logIt('调起'+(kind==='face'?'人脸':'指纹')+'识别 → 交第三方引擎比对');
  render();
  bioTimer = setTimeout(function(){
    S.data.bio = { kind:kind, st:'ok' };
    logIt((kind==='face'?'人脸':'指纹')+'比对通过');
    render();
  }, 1100);
}

/* =========================================================
   v1.0.16 · 改密页（强制 / 可跳过）
   Windows 版第 4.5.3 节的移植。三处口径保持一致：
     ① 密码策略只定义一次（见 pwIssues），改密与找回密码共用；
     ② 不合规时不仅说「格式不对」，还要列出具体没满足哪一条；
     ③ 强制分支不设「取消」「跳过」—— 初始密码与已过期都不给退路。
   ========================================================= */
var PW_RULES = [
  { k:'len',  t:'长度为 8-20 个字符' },
  { k:'kind', t:'至少包含数字、大写字母、小写字母、特殊字符中的 3 类' },
  { k:'weak', t:'不能使用弱口令（账号名、连续或重复数字等）' }
];

/* 逐条判定，返回未满足项。改密页与忘记密码页都用它，避免两处策略跑偏。 */
function pwIssues(pw, account){
  var bad = [];
  if(!(pw.length >= 8 && pw.length <= 20)) bad.push('len');
  var kinds = 0;
  if(/[0-9]/.test(pw)) kinds++;
  if(/[A-Z]/.test(pw)) kinds++;
  if(/[a-z]/.test(pw)) kinds++;
  if(/[^A-Za-z0-9]/.test(pw)) kinds++;
  if(kinds < 3) bad.push('kind');
  var low = (pw||'').toLowerCase();
  var acc = (account||'').toLowerCase();
  var weak = /^(123456|12345678|password|admin|qwerty|abc123|111111|000000)/.test(low)
          || /(.)\1{3,}/.test(pw)
          || /0123456789/.test(pw)
          || (acc && low.indexOf(acc) >= 0);
  if(weak) bad.push('weak');
  return bad;
}

/* 剩余天数 N —— 由服务端在返回密码状态时一并下发（真实环境取接口字段），
   原型里由演示开关给值，默认 3 天。N 只用于「即将过期」这一支：
   过期与初始密码不带天数，所以没有 N 也不该影响它们。 */
function chpwDays(){
  var n = parseInt((S.demo && S.demo.pwdDays), 10);
  if(isNaN(n) || n < 1) n = 3;
  if(n > 90) n = 90;          /* 超过 90 天就不叫「即将过期」了，防后台配错 */
  return n;
}

/* 改密页只可能在「账号密码」这一种首因素验过之后出现 —— 所以抬头回显是谁，
   让用户确认「拦的是我自己的账号」，而不是一台转手后不知道自己是谁的机器。
   副标题一句话讲完「为什么拦你 / 还剩多久」，不带逗号句号，统一灰色：
   这里不是报错，是流程中的一步，飘红飘黄反而像出了事故。 */
function chpwUser(){
  return S.data.authUser || S.bindIam || S.user || '';
}
function chpwReasonText(reason){
  var n = chpwDays();
  var who = chpwUser();
  var t = who ? ('您好，' + who) : '您好';   /* 取不到账号就只留「您好」，不编造 */
  if(reason === 'expired') return { t:t, s:'登录密码已过期请重新设置' };
  if(reason === 'soon')    return { t:t, s:'密码还有 <b>'+n+'</b> 天过期请及时修改' };
  return { t:t, s:'初始密码请修改后继续登录' };
}

/* 规则逐条实时判定：输入即给结果，不用等提交才被告知哪条不合格。
   符号三态 —— 未输入灰点 / 满足绿勾 / 不满足红叉。 */
function chpwRuleRow(r, st){
  var mk = st==='ok' ? '<span class="bul">'+icoTick()+'</span>'
         : st==='no' ? '<span class="bul">'+icoCross()+'</span>'
         : '<span class="bul">·</span>';
  return '<div class="it '+(st||'')+'" data-k="'+r.k+'">'+mk+
    '<span>'+esc(r.t)+'</span></div>';
}
function chpwRuleState(pw, k){
  if(!pw) return '';
  return (pwIssues(pw, S.data.authUser || S.user).indexOf(k) >= 0) ? 'no' : 'ok';
}
function onChpwInput(v){
  var c = S.chpw; if(!c) return;
  c.p1 = v || '';
  var box = document.querySelector('.chpw .reqbox');
  if(!box) return;
  PW_RULES.forEach(function(r){
    var el = box.querySelector('.it[data-k="'+r.k+'"]');
    if(!el) return;
    var st = chpwRuleState(c.p1, r.k);
    el.className = 'it ' + st;
    el.innerHTML = chpwRuleRow(r, st);
  });
}

function chpwBody(){
  var c = S.chpw || { reason:'initial', err:null, bad:[] };
  var T = chpwReasonText(c.reason);
  var canSkip = (c.reason === 'soon');
  var bad = c.bad || [];
  var pw = c.p1 || '';

  var rules = PW_RULES.map(function(r){
    /* 提交过一次失败后，即使框里没内容也把不合格项标出来 —— 那是有依据的判定，不是猜 */
    var st = chpwRuleState(pw, r.k) || (bad.indexOf(r.k) >= 0 ? 'no' : '');
    return chpwRuleRow(r, st);
  }).join('');

  return '<div class="body chpw">'+
    '<div class="brand" style="gap:7px">'+
      '<div class="logo-box"><img src="assets/logo-color-128.png"'+
      ' width="38" height="38" alt="E登录" /></div>'+
      '<h1 style="font-size:15px">'+esc(T.t)+'</h1>'+
      '<p>'+T.s+'</p>'+
    '</div>'+
    ipt('chNew','新密码',icoLock(), { type:'password', eye:true, val:pw,
      oninput:'onChpwInput(this.value)' })+
    ipt('chNew2','确认新密码',icoLock(), { type:'password', eye:true, val:c.p2||'' })+
    '<div class="reqbox">'+rules+'</div>'+
    (c.err ? '<div class="errmsg">'+esc(c.err)+'</div>' : '')+
    '<button class="btn btn-primary btn-block" onclick="submitChpw()">确定</button>'+
    (canSkip
      ? '<div class="footrow"><button class="lnk" onclick="skipChpw()">'+
        '跳过，直接登录</button></div>' : '')+
  '</div>';
}

/* 提交改密。校验顺序：两次一致 → 策略合规 → 通过。 */
function submitChpw(){
  function v(id){ var e=document.getElementById(id); return e ? (e.value||'') : ''; }
  var p1 = v('chNew'), p2 = v('chNew2');
  var c = S.chpw || (S.chpw = { reason:'initial' });
  /* 整页重渲染会重建输入框，先把已输的内容收进状态，渲染时再回填 ——
     否则用户每被提示一次就得重新敲一遍密码。 */
  c.p1 = p1; c.p2 = p2;

  if(!p1){ c.err='请输入新密码'; render(); return; }
  if(p1 !== p2){ c.err='两次输入的密码不一致'; c.bad=[]; render(); return; }

  var bad = pwIssues(p1, S.data.authUser || S.user);
  if(bad.length){
    /* 只说「格式不对」等于让用户自己猜，必须点出是哪一条 */
    var names = bad.map(function(k){
      return { len:'长度不在 8-20 位之间', kind:'字符种类不足 3 类',
               weak:'命中了弱口令规则' }[k] || k;
    });
    c.bad = bad;
    c.err = '密码格式不正确：' + names.join('；');
    logIt('新密码不合规 → ' + names.join('、'));
    render();
    return;
  }

  c.err=null; c.bad=[];
  S.data.pwdState = 'normal';
  logIt('改密成功（' + (c.reason==='initial'?'初始密码':'过期密码') + '）→ 回到判定顺序，继续判二次验证');
  S.step=null; S.chpw=null;
  render();
  setTimeout(function(){ afterChpwStep(); }, 260);
}

/* 仅「即将过期」分支可用：跳过不算异常，只是把风险留给用户。 */
function skipChpw(){
  logIt('密码即将过期 → 用户选择【跳过，直接登录】');
  S.step=null; S.chpw=null;
  render();
  setTimeout(function(){ afterChpwStep(); }, 160);
}

/* =========================================================
   v1.0.16 · 二次验证（v1.0.17 起为整页）
   后台策略决定「要不要验」「允许哪几种方式」，客户端只负责渲染。
   方式集合里要排掉两样东西：
     · 与首因素完全相同的方式（输入密码再输一次密码，等于没验）
     · 首因素已用过生物识别（人脸 + 指纹同属「你是谁」，同一类因素验两遍也等于没验）
   ========================================================= */
function secondWays(){
  /* 二次验证只能用「后台开通了的方式」—— 没开通短信却让用户收短信，那是配置跑偏。
     策略给的是候选集，开通集是前提，两头都要满足。 */
  var allow = (S.demo.secondWays || ['sms','face','fp','otp']).filter(function(id){
    return (S.enabled || []).indexOf(id) >= 0;
  });
  var first = S.method;
  /* 首因素若已是生物识别，二次就不能再用生物识别 ——
     人脸+指纹都是「你是谁」，同一类因素验两次不构成双因素。 */
  var firstIsBio = METHODS.some(function(m){ return m.id===first && m.bio; });
  var out = METHODS.filter(function(m){
    if(allow.indexOf(m.id) < 0) return false;
    if(m.id === 'qr') return false;                    /* 扫码不能当第二因素 */
    if(m.id === first) return false;                   /* 与首因素重复 */
    if(m.bio && firstIsBio) return false;
    return true;
  });
  /* 兜底：策略配的方式全被排掉了，或后台压根没开通第二种方式。
     先退一步找「已开通、能当第二因素、又不是首因素」的那个（最常见是账密），
     实在一个都没有才给短信 —— 宁可让用户多收一条码，也不能把界面渲染成空壳。
     注：只开账密还要求二次验证，本身就是后台配错的组合，真实产品在策略页会拦住。 */
  if(!out.length){
    out = METHODS.filter(function(m){
      return m.sec && m.id !== first && (S.enabled || []).indexOf(m.id) >= 0;
    });
  }
  if(!out.length){
    out = METHODS.filter(function(m){ return m.id==='sms'; });
  }
  return out;
}

function secondBody(way){
  if(way === 'sms'){
    /* 手机号默认带出该账号在 IAM 档案里的绑定号，可改（与 Windows 版一致） */
    var prof = fpProfile(S.data.authUser || S.user);
    return ipt('sePhone','手机号码',icoPhone(),
             { val:S.data.secPhone || prof.sms })+
           ipt('seCode','短信验证码',icoShield(),
             { val:S.data.secCode || '',
               tail:'<button class="btn btn-secondary" onclick="sendSecSms()">'+
               '获取验证码</button>' });
  }
  if(way === 'otp'){
    return ipt('seOtp','动态口令',icoKey(), { val:S.data.secOtp || '' });
  }
  if(way === 'pw'){
    return ipt('sePw','当前账号密码',icoLock(),
             { type:'password', eye:true, val:S.data.secPw || '' });
  }
  /* 人脸 / 指纹：与首因素同一套采集区，状态走 S.data.secBio */
  var st2 = (S.data.secBio && S.data.secBio.st) || 'idle';
  return '<div class="bio2">'+bioCore(way, st2, true)+'</div>';
}

/* 二次验证整页。结构与改密页、登录表单保持同一套：
   品牌区 → 方式切换 → 输入 → 主按钮 → 返回。
   方式切换直接复用首因素那套 tabs（图标 + 两字），
   让用户一眼认出「这还是同一套登录方式」，而不是另一套陌生控件。 */
function secondPage(){
  var ways = secondWays();
  var cur = S.second.cur;
  if(!ways.some(function(m){ return m.id===cur; })) cur = ways[0] ? ways[0].id : 'sms';

  var tabs = ways.length > 1
    ? '<div class="tabs">'+ways.map(function(m){
        return '<button class="'+(cur===m.id?'on':'')+'" title="'+esc(m.ai)+'"'+
          ' onclick="setSecWay(\''+m.id+'\')">'+m.ic()+
          '<span>'+esc(m.nm)+'</span></button>';
      }).join('')+'</div>'
    : '';

  return '<div class="body">'+
    '<div class="brand" style="gap:6px">'+
      '<div class="logo-box"><img src="assets/logo-color-128.png"'+
      ' width="40" height="40" alt="E登录" /></div>'+
      '<h1 style="font-size:16px">需要二次验证</h1>'+
      '<p>为了保障您的账户安全，请完成二次验证</p>'+
    '</div>'+
    tabs+
    secondBody(cur)+
    (S.second.err ? '<div class="errmsg">'+esc(S.second.err)+'</div>' : '')+
    ((cur==='face'||cur==='fp')
      ? bioCta(cur, (S.data.secBio && S.data.secBio.st) || 'idle', '验证',
               'submitSecond()', false, 'simSecBio')
      : '<button class="btn btn-primary btn-block" onclick="submitSecond()">验证</button>')+
    '<div class="backrow"><button class="backbtn" onclick="secondBack()">'+
      '<svg width="11" height="11" viewBox="0 0 12 12" fill="none">'+
      '<path d="M7.5 2.5L4 6l3.5 3.5" stroke="currentColor" stroke-width="1.5"'+
      ' stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '返回上一级认证登录</button></div>'+
  '</div>';
}

function setSecWay(w){
  S.second.cur = w;
  S.second.err = null;
  S.data.secBio = null;
  logIt('二次验证切换方式 → ' + methodById(w).ai);
  render();
}
var secBioTimer=null;
function simSecBio(way){
  clearTimeout(secBioTimer);
  S.data.secBio = { st:'busy' };
  logIt('二次验证调起'+(way==='face'?'人脸':'指纹')+'识别');
  render();
  secBioTimer = setTimeout(function(){
    S.data.secBio = { st:'ok' };
    logIt('二次验证'+(way==='face'?'人脸':'指纹')+'比对通过');
    render();
  }, 1000);
}
function sendSecSms(){
  var e = document.getElementById('sePhone');
  if(!e || !isPhone((e.value||'').trim())){ toast('请输入正确的 11 位手机号码'); return; }
  S.data.secPhone = (e.value||'').trim();
  logIt('二次验证 → 下发短信验证码（60 秒倒计时）');
  toast('验证码已发送，请查收');
}

function submitSecond(){
  var cur = S.second.cur;
  function v(id){ var e=document.getElementById(id); return e ? (e.value||'').trim() : ''; }

  /* 整页重渲染会重建输入框，先把已填的收进状态，渲染时回填 ——
     否则提示一次「验证码不对」，用户就得再敲一遍。 */
  S.data.secPhone = v('sePhone') || S.data.secPhone;
  S.data.secCode  = v('seCode');
  S.data.secOtp   = v('seOtp');
  S.data.secPw    = v('sePw');

  if((cur==='face' || cur==='fp')){
    if(!(S.data.secBio && S.data.secBio.st==='ok')){
      S.second.err = (cur==='face'?'请先完成人脸识别':'请先完成指纹校验');
      render(); return;
    }
  } else if(cur === 'sms'){
    if(!v('sePhone')){ S.second.err='请输入手机号码'; render(); return; }
    if(!isPhone(v('sePhone'))){ S.second.err='请输入正确的 11 位手机号码'; render(); return; }
    if(!v('seCode')){ S.second.err='请输入短信验证码'; render(); return; }
  } else if(cur === 'otp'){
    if(!v('seOtp')){ S.second.err='请输入动态口令'; render(); return; }
  } else if(cur === 'pw'){
    if(!v('sePw')){ S.second.err='请输入当前账号密码'; render(); return; }
  }

  S.second = null;
  S.data.secBio = null;
  logIt('二次验证通过 → 继续原流程（不重走首因素认证）');
  render();
  setTimeout(function(){ finishAuth(); }, 200);
}

/* 返回一级：本次二次验证作废，首因素认证结果同时失效，
   用户需要重新提交首因素 —— 与 Windows 版「返回即作废、不复用」一致。 */
function secondBack(){
  S.second = null;
  S.data.secBio = null;
  logIt('点【返回上一级认证登录】→ 本次二次验证作废，需重新完成首因素认证');
  render();
  toast('已返回上一级，请重新认证');
}

/* =========================================================
   v1.0.16 · 认证链（判定顺序的落地）
   凭据认证通过之后依次判：密码状态 → 二次验证 → 收尾。
   改密排在二次验证之前；改密成功不直接收尾，而是回到第②步继续判。
   ========================================================= */
function startAuthFlow(stage, account){
  S.data.authStage = stage;              /* 'bind' | 'login' */
  S.data.authUser = account || S.data.user || S.user || 'zhangsan';
  S.step = null;
  S.second = null;
  S.data.bio = null;
  S.data.secBio = null;

  /* ① 密码状态。真实环境由服务端在凭据校验通过时一并返回，
     客户端只按状态渲染，不自己判断密码对不对、过没过期。
     ⚠️ 只有「账号密码」这一种首因素才走这一步：扫码 / 短信 / 动态口令 /
     人脸 / 指纹都不提交密码，服务端也就没有密码状态可返回 ——
     认证链到改密页为止的所有分支，前提都是账密已经验过。 */
  var isPw = (S.method === 'pw');
  var st = isPw ? (S.demo.pwdState || 'normal') : 'normal';
  if(!isPw && S.demo.pwdState && S.demo.pwdState !== 'normal'){
    logIt('首因素为「'+methodById(S.method).nm+'」，不涉及密码 → 不返回密码状态，跳过改密');
  }
  S.data.pwdState = st;
  if(st === 'initial' || st === 'expired' || st === 'soon'){
    enterChpw(st);
    return;
  }
  afterChpwStep();
}

function enterChpw(reason){
  S.step = 'chpw';
  S.chpw = { reason:reason, err:null, bad:[] };
  logIt('密码状态判定 → ' + ({initial:'初始密码，强制改密',
                             expired:'密码已过期，强制改密',
                             soon:'即将过期（还剩 '+chpwDays()+' 天），可改可跳过'}[reason]));
  render();
}

/* 第②步：二次验证。策略不开就直接收尾。 */
function afterChpwStep(){
  if(S.demo.second){
    var ways = secondWays();
    S.second = { cur: (methodsHas(ways, S.demo.secondWay) ? S.demo.secondWay : ways[0].id), err:null };
    logIt('后台策略要求二次验证 → 整页切到验证页（' + ways.map(function(m){ return m.nm; }).join(' / ') + '）');
    render();
    return;
  }
  finishAuth();
}
function methodsHas(list, id){
  return list.some(function(m){ return m.id === id; });
}

/* 第③步：收尾。首次绑定写绑定记录，登录建立会话 —— 两条路的终点不同。 */
function finishAuth(){
  var stage = S.data.authStage;
  S.data.authStage = null;
  if(stage === 'bind') commitBindAndWelcome();
  else commitLoginAndWelcome();
}

/* 绑定页那行只读展示 = 本机 macOS 账户名（macUser），**不是** IAM 账号。
   二者是绑定关系的两端：左边这台机器（系统给），右边用户输的统一身份账号。

/* 二维码：21x21 伪随机点阵 */
function qrSvg(){
  var cells=[], n=21, seed=7;
  function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
  for(var y=0;y<n;y++){ for(var x=0;x<n;x++){
    var finder=(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
    if(finder){
      var lx=x<7?x:x-(n-7), ly=y<7?y:y-(n-7);
      var ring=(lx===0||lx===6||ly===0||ly===6);
      var core=(lx>=2&&lx<=4&&ly>=2&&ly<=4);
      if(ring||core) cells.push([x,y]);
    } else if(rnd()>0.52) cells.push([x,y]);
  }}
  var s=100/n, rects=cells.map(function(c){
    return '<rect x="'+(c[0]*s).toFixed(2)+'" y="'+(c[1]*s).toFixed(2)+
      '" width="'+s.toFixed(2)+'" height="'+s.toFixed(2)+'" fill="'+
      (S.data.qrExpired?'#B6BCC4':'#1A1D21')+'"/>'; }).join('');
  return '<svg viewBox="0 0 100 100">'+rects+'</svg>';
}

/* ---------- 忘记密码：一屏到底（v1.0.5） ---------- */
/* 进入忘记密码：重置为初始态（渠道=短信，账号按渠道预填，未验证） */
function resetForgetState(){
