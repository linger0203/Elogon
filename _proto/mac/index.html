/* ── 手机号校验（v1.0.10）─────────────────────────────────────
   口径：11 位国内手机号 —— 1 开头、第二位 3-9、其后 9 位数字。
   三处共用这一个判定：短信登录框 / 忘记密码手机号渠道 / 忘记密码手填。 */
function isPhone(v){
  return /^1[3-9]\d{9}$/.test((v||'').trim());
}

/* ── 模拟档案表（v1.0.10）──────────────────────────────────────
   真实环境这些值来自 IAM 档案；原型里用一张表模拟。
   v1.0.10 起：绑定成功时**自动分配一个手机号**并写进这张表 ——
   手机号无法从账号名派生，之前留空由用户手填；现在改为发号，
   短信登录与忘记密码都能用上，且「绑谁返显谁」的口径不变。
   发号规则（沁定）：138 开头 + 按序编号，第 n 个绑定账号拿 138****000n。
   同一账号重复绑定拿到同一个号（按表里已有记录返回）。 */
var FP_PROFILE = {
  zhangsan:{ sms:'13800000001', email:'zhangsan@corp.com', ding:'zhangsan' }
};
var FP_PHONE_SEQ = 1;   /* 内部序号；内置的 zhangsan 不占号池，另用一个固定号 */

function maskPhone(v){
  v = (v||'').trim();
  return v.length===11 ? v.slice(0,3)+'****'+v.slice(7) : v;
}

/* 绑定成功时调用：给这个账号分配一个档案手机号（已分配则原样返回）
   号段：138 + 8 位序号（10000001 起）→ 共 11 位，天然满足 1[3-9]\d{9}。
   取值必须与 isPhone 的格式规则自洽，否则档案里发出来的号自己过不了校验。 */
function issuePhone(iam){
  iam = (iam||'').trim();
  if(!iam) return '';
  if(!FP_PROFILE[iam]){
    var seq = FP_PHONE_SEQ++;
    FP_PROFILE[iam] = {
      sms: '138' + String(10000000 + seq).slice(-8),
      email: iam + '@corp.com',
      ding: iam
    };
    logIt('为 '+iam+' 分配档案手机号：'+maskPhone(FP_PROFILE[iam].sms));
  }
  return FP_PROFILE[iam].sms;
}

function fpProfile(u){
  u = (u||'').trim();
  if(FP_PROFILE[u]) return FP_PROFILE[u];
  /* 档案里还没有这个账号：邮箱补企业域名、钉钉用账号本身；
     手机号此时尚未分配（绑定成功那刻才会发），留空不编造 */
  return { sms:'', email: u ? u+'@corp.com' : '', ding: u || '' };
}
function fpChannels(){
  var p=fpProfile((S.bindIam||'').trim());
  return {
    sms:   { lb:'手机号', acc:p.sms,   ph:'请输入手机号码', ico:icoPhone() },
    email: { lb:'邮箱',   acc:p.email, ph:'请输入邮箱地址', ico:icoMail()  },
    ding:  { lb:'钉钉',   acc:p.ding,  ph:'请输入钉钉账号', ico:icoUser()  }
  };
}

/* 密码策略：规则表 + 合规判定（渲染与按钮禁用态共用同一份规则） */
function policyRules(v){
  v = v || '';
  return [
    { t:'长度为 8-20 个字符', ok: v.length>=8 && v.length<=20 },
    { t:'至少包含数字、大写字母、小写字母、特殊字符中的 3 种',
      ok: ['[0-9]','[A-Z]','[a-z]','[^A-Za-z0-9]'].filter(function(r){
        return new RegExp(r).test(v); }).length>=3 },
    { t:'未使用弱口令',
      ok: v.length>0 && !weakHit(v) }
  ];
}
/* 弱口令判定：整串即弱口令，或弱片段占比过高（>=60%）才判失败。
   避免 Abcd@1234 这类“含连续数字但整体够强”的密码被误杀。 */
function weakHit(v){
  var low = (v||'').toLowerCase();
  var weakWords = ['password','admin','qwerty','abc123','iloveyou'];
  if(weakWords.some(function(w){ return low.indexOf(w) >= 0; })) return true;
  /* 纯数字且重复（如 888888） */
  if(/^(\d)\1{5,}$/.test(low)) return true;
  /* 纯数字且连续递增/递减（如 123456 / 654321） */
  if(/^\d{6,}$/.test(low) && ('0123456789'.indexOf(low) >= 0 || '9876543210'.indexOf(low) >= 0)) return true;
  /* 弱片段占比过高（>=60%）才判失败 */
  var segs = ['1234','123456','abcd','0000','1111','6666','8888','000000'];
  var hit = 0;
  segs.forEach(function(sg){ if(low.indexOf(sg) >= 0) hit = Math.max(hit, sg.length); });
  if(hit > 0 && hit / low.length >= 0.6) return true;
  return false;
}

/* 密码是否全部通过策略 */
function policyPass(v){
  if(!v || v.length===0) return false;
  return policyRules(v).every(function(r){ return r.ok; });
}

/* 密码要求浮层内容（未输入 = 灰点；已输入 = ✓ / ✕ 实时反馈） */
function reqPopHtml(v){
  v = v || '';
  var filled = v.length > 0;
  var mark = function(ok){
    if(!filled) return '<i></i>';
    return ok
      ? '<svg width="7" height="7" viewBox="0 0 7 7" fill="none">'+
        '<path d="M1.3 3.6l1.5 1.5 2.9-3.2" stroke="#fff" stroke-width="1.4"'+
        ' stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg width="6" height="6" viewBox="0 0 6 6" fill="none">'+
        '<path d="M1.3 1.3l3.4 3.4M4.7 1.3L1.3 4.7" stroke="#fff" stroke-width="1.3"'+
        ' stroke-linecap="round"/></svg>';
  };
  return '<div class="rt">密码要求</div>'+
    policyRules(v).map(function(r){
      return '<div class="pi '+(filled?(r.ok?'ok':'no'):'')+'">'+
        '<span class="mk">'+mark(r.ok)+'</span><span>'+r.t+'</span></div>';
    }).join('');
}

/* ---------- 轨道渲染 ---------- */

/* ---------- 往外层推「现在停在哪一页」（v1.0.14）----------
   说明页（E登录_Mac版_交互说明.html）把 72 条说明搬到了 iframe 外面，
   index 则只剩一个铺满的原型。两页都需要知道用户在轨道上点到了哪 ——
   否则「重载 / 交互说明 / 在新标签打开」都会落回首页，等于白点。

   为什么由里往外推、而不是外层来读：
   iframe 走 file:// 时是不透明源，外层碰 frame.contentWindow.location
   会直接抛 SecurityError。所以只能原型自己往外说。

   只在真的被嵌入时发；独立打开时 window.parent === window，直接返回。
   全程 try/catch —— 通知失败绝不该影响原型本身。 */
/* 改密页 / 二次验证页是「整页推进的步骤页」，宿主 S.view 仍是 bind 或 loginagain，
   但对外要报自己的名字 —— 否则外层可交互 PRD 会把它当成宿主页，章节跳回上一节。
   与「本页交互说明」的 notesKey() 用同一条判断，两处口径必须一致。 */
function viewNode(){
  if(S.step === 'chpw') return 'chpw';
  if(S.second) return 'second';
  return S.view;
}
function notifyHost(){
  try{
    if(window.parent === window) return;
    window.parent.postMessage({ t:'e-login-view', node:viewNode(), name:curName() }, '*');
  }catch(e){}
}

/* v1.0.15：外层「可交互 PRD」反向驱动原型的唯一入口。
   外层点导航 / 点交互点编号时，调 ELogin.go('settings') 直接把原型切过去，
   而不是给它换一个 URL 重载 —— 重载会丢掉当前演示状态，也会闪一下。

   两个动作分开是有原因的：
     passTo()  让守卫放行。g o() 本身会拦「未绑定不能进设置」「未登录不能进门户」，
               但外层是从文档里点过来的，用户明确要看那一页，不是误触。
     go()      照常走一遍，所以视图名归一、轨道高亮、状态面板都是真的。 */
window.ELogin = {
  go: function(v){
    try{
      if(!v) return false;
      /* 认证链的两个步骤页没有独立视图 —— 它们是绑在宿主页上的整页推进。
         外层点 §3.10 / §3.11 时直接送到这两步，省得研发自己从登录页点进去。 */
      if(v === 'chpw' || v === 'second'){
        S.bind = true;
        if(!S.bindIam) commitBind('zhangsan', true);
        S.login = false; S.user = S.bindIam || 'zhangsan';
        S.view = 'loginagain';
        S.data.authUser = S.bindIam || 'zhangsan';
        S.data.authStage = 'login';
        S.method = 'pw';
        if(v === 'chpw'){
          S.second = null;
          enterChpw(S.demo.pwdState === 'normal' ? 'soon' : S.demo.pwdState);
        }else{
          S.step = null; S.chpw = null;
          S.demo.pwdState = 'normal';
          S.second = { cur:'sms', err:null };
          render();
        }
        return true;
      }
      var deep = ['settings','apps','exitok','loginagain','panel','panel-off','panel-off-new','forgot',
                  'cancel1','cancel2','cancel3','menubar'];
      if(deep.indexOf(v) >= 0){
        S.bind = true;
        if(!S.bindIam) commitBind('zhangsan', true);
      }
      if(['settings','apps','exitok','panel','panel-off','panel-off-new'].indexOf(v) >= 0){
        S.login = (v === 'panel-off' || v === 'panel-off-new') ? false : true;
        S.user = S.bindIam || 'zhangsan';
      }
      if(v === 'loginagain'){ S.login = false; S.user = S.bindIam || 'zhangsan'; }
      if(v === 'menubar'){ S.login = true; S.user = S.bindIam || 'zhangsan'; }
      if(v === 'forgot'){ S.view = 'forgot'; }
      go(v);
      return true;
    }catch(e){ return false; }
  },
  /* 只报当前在哪，不改变任何状态 —— 给外层做初始对齐用 */
  where: function(){ return { node:viewNode(), name:curName() }; }
};

/* ---------- 交互动作 ---------- */
/* 轨道节点 = 演示跳转通道：自动补齐该页所需的最小前置状态，不走守卫。
   目的：演示时点任意节点都可达，同时不出现「未登录却显示已登录面板」的矛盾。 */
function goForce(v){
  var needLogin = ['menubar','panel','apps','settings','exitok'];
  var needBind  = ['menubar','panel','apps','settings','exitok','loginagain','forgot',
                   'cancel1','cancel2','cancel3'];

  if(needBind.indexOf(v) >= 0 && !S.bind){
    S.bind = true;
    if(!S.user) S.user = 'zhangsan';
    /* 跳转通道也要把绑定记录补上，否则退出页会因为没记录而跳过账号比对 */
    if(!S.bindIam) commitBind(S.user, true);
    logIt('演示跳转：自动补上「已绑定 ' + S.bindIam + '」');
  }
  if(needLogin.indexOf(v) >= 0 && !S.login){
    S.login = true;
    logIt('演示跳转：自动补上「已登录」');
  }
  if(v === 'panel-off'){ S.login = false; }
  if(v === 'forgot' && S.view !== 'forgot'){ resetForgetState(); startFpTimer(); }

  S.view = v; S.modal = null; S.data.errMsg = null; S.data.cancelErr = null;
  S.data.loginErr = null; S.data.canUnbind = false;
  logIt('进入「' + curName() + '」');
  render();
  notifyHost();
}

function go(v){
  /* panel-off-new 只是嵌入模式用的「无绑定记录的未登录面板」别名，
     渲染层没有这个 case，进 render 前归一成 panel-off。
     真正的分流发生在模板里：读 S.bindIam 决定按钮文案与去向。 */
  if(v==='panel-off-new'){ v='panel-off'; }
  if(v==='panel' && !S.login){ v='panel-off'; }
  if(v==='panel-off' && S.login){ v='panel'; }
  if(v==='settings' || v==='apps'){
    if(!S.bind){ toast('还没有绑定账号，先完成绑定'); return; }
  }
  /* 应用门户需要 IAM 会话；设置是本地配置，未登录也能进（与 03 页「未登录态面板只留登录+设置」一致） */
  if(v==='apps' && !S.login){ toast('当前未登录，请先登录'); return; }
  if(v==='forgot' && !S.bind){ toast('还没有绑定账号'); return; }
  if(v==='forgot' && S.view!=='forgot'){ resetForgetState(); startFpTimer(); }
  /* 认证链的中间态只属于「当前这一步」。一旦离开这一页（点轨道节点跳走、
     走自动演示、改完密码回登录页），改密 / 二次验证的上下文与半截的生物识别
     结果都该作废 —— 否则 S.step / S.second 还挂着，render 会把整页内容
     又画成上一步那一屏，人已经到了别的页却看到改密页。
     与「关闭窗口 = 放弃本次认证」是同一条规则，只是出口不同。 */
  if(S.step || S.second){
    clearTimeout(bioTimer); clearTimeout(secBioTimer);
    S.step=null; S.chpw=null; S.second=null;
    S.data.bio=null; S.data.secBio=null;
  }
  S.view=v; S.modal=null; S.data.errMsg=null;
  S.data.loginErr=null; S.data.canUnbind=false;
  logIt('进入「'+curName()+'」');
  render();
  notifyHost();
}

/* 决定“关闭窗口后回到哪里”：已绑定收进菜单栏，未绑定回弹窗并可从 Dock 重新唤起 */
function winClose(e){
  if(e) e.stopPropagation();
  var w=document.querySelector('.win');
  if(w){ w.classList.add('closing'); }
  logIt('点【关闭】：窗口收起');
  /* 关掉的是登录 / 绑定这类认证窗口时，记住它 ——
     从 Dock 再点开应该把同一个窗口原样叫回来（从头开始），
     而不是先弹一个菜单栏面板让人再点一次。
     「设置」这类非认证窗口不记，重开还是走下面的常规分流。 */
  var authViews = ['bind','bindfail','loginagain','cancel','cancel2','cancel3'];
  S.data.winBack = (authViews.indexOf(S.view) >= 0) ? S.view : null;
  setTimeout(function(){
    if(S.bind){
      S.view='menubar'; S.winOpen=false;
      toast('窗口已关闭，可从菜单栏图标重新打开');
    } else {
      /* 未绑定：关闭后进入“桌面空白”状态，可从 Dock 图标重新唤起 */
      S.view='deskblank'; S.winOpen=false;
      toast('已关闭，可点 Dock 上的 E 登录图标重新打开');
    }
    /* 关闭 = 放弃这次认证。认证链上的中间态（改密 / 二次验证）与
       已经采集到一半的生物识别结果一并作废 —— 否则从 Dock 重新唤起时
       窗口还停在改密页上，用户看到的是「上次没做完的那一步」。
       真实客户端同理：窗口销毁，进程内的认证上下文跟着丢。 */
    S.step=null; S.chpw=null; S.second=null;
    S.data.bio=null; S.data.secBio=null;
    S.data.pwdState=null;
    /* 正在跑的生物识别定时器也要掐掉，否则窗口关了它还在跑，
       回头重新打开时突然自己变成「识别通过」 */
    clearTimeout(bioTimer); clearTimeout(secBioTimer);
    render();
  }, 160);
}

/* 拖动标题栏移动窗口 */
function dragWinStart(e){
  if(e.target.classList.contains('lights') || e.target.tagName==='I') return;
  var w=document.querySelector('.win');
  if(!w || w.classList.contains('maxed')) return;
  var r=w.getBoundingClientRect();
  var desk=document.querySelector('.desk').getBoundingClientRect();
  var offX=e.clientX-r.left, offY=e.clientY-r.top;

  w.style.position='absolute';
  w.style.left=(r.left-desk.left)+'px';
  w.style.top=(r.top-desk.top)+'px';
  w.style.transform='none';
  w.style.margin='0';

  function move(ev){
    var nx=ev.clientX-desk.left-offX, ny=ev.clientY-desk.top-offY;
    nx=Math.max(0, Math.min(nx, desk.width-r.width));
    ny=Math.max(0, Math.min(ny, desk.height-r.height));
    w.style.left=nx+'px'; w.style.top=ny+'px';
  }
  function up(){
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
  }
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
  e.preventDefault();
}

/* 从 Dock / 菜单栏重新唤起窗口 */
function reopenWin(){
  if(S.data.winBack){
    /* 关的是认证窗口 → 原样叫回来；中间态（改密 / 二次验证）在关闭时已作废，
       所以带回来的是这个窗口的初始形态，不是上次没做完的那一步。 */
    S.view = S.data.winBack;
    S.data.winBack = null;
  }
  else if(S.bind && S.login){ S.view='panel'; }
  else if(S.bind){ S.view='menubar'; }
  else { S.view='bind'; }
  S.winOpen=true; S.winMax=false;
  logIt('从 Dock 图标重新打开窗口');
  render();
}

var sliderResolve=null;
function askSlider(){
  logIt('点【获取验证码】，弹出滑块防人机校验');
  var d=document.getElementById('desk');

    '<h3 style="font-size:13.5px">安全验证</h3>'+
    '<div class="slider" id="sl"><div class="fill"></div>'+
    '<span class="track">向右拖动滑块完成验证</span>'+
    '<div class="thumb" id="thumb">'+
    '<svg width="16" height="16" viewBox="0 0 16 16" fill="none">'+
    '<path d="M6 4l4 4-4 4" stroke="#007AFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
    '</div></div>'+
    '<div class="hint" style="text-align:center">拖动到最右侧即通过</div>'+
  '</div></div>';
  d.appendChild(ov);

function dragInit(){
  var sl=document.getElementById('sl');
  var th=document.getElementById('thumb');
  var fl=sl.querySelector('.fill');
  var track=sl.querySelector('.track');
  if(!sl) return;
  var max=sl.clientWidth-46;
  var dragging=false, startX=0;

  function down(e){
    dragging=true;
    startX=(e.touches?e.touches[0].clientX:e.clientX);
    th.style.transition='none'; fl.style.transition='none';
    document.addEventListener('mousemove',move);
    document.addEventListener('mouseup',up);
    document.addEventListener('touchmove',move,{passive:false});
    document.addEventListener('touchend',up);
  }
  function move(e){
    if(!dragging) return;
    e.preventDefault&&e.preventDefault();
    var x=(e.touches?e.touches[0].clientX:e.clientX);
    var dx=Math.max(0, Math.min(max, x-startX));
    th.style.left=(2+dx)+'px';
    fl.style.width=(2+dx)+'px';
    if(dx>max*0.55) track.textContent=loc('松开完成验证');
    else track.textContent=loc('向右拖动滑块完成验证');
  }
  function up(){
    if(!dragging) return;
    dragging=false;
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move);
    document.removeEventListener('touchend',up);
    var cur=parseFloat(th.style.left)||2;
    if(cur> max*0.9){
      sl.classList.add('done');
      track.textContent=loc('验证通过');
      th.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none">'+
        '<path d="M3.5 8.4l3.2 3.2 5.8-6.4" stroke="#34C759" stroke-width="1.8"'+
        ' stroke-linecap="round" stroke-linejoin="round"/></svg>';
      logIt('滑块拖动通过');
      setTimeout(function(){
        var ov=document.getElementById('sliderOv'); if(ov) ov.remove();
        onSliderPass();
      }, 420);
    } else {
      th.style.transition='left .2s'; fl.style.transition='width .2s';
      th.style.left='2px'; fl.style.width='0';
      track.textContent=loc('向右拖动滑块完成验证');
      logIt('滑块未拖到位，校验失败并重置');
    }
  }
  th.addEventListener('mousedown',down);
  th.addEventListener('touchstart',down,{passive:true});
}

function onSliderPass(){

/* 59 秒重发倒计时 */
/* 忘忘密码页：业务总倒计时（300 秒），每秒递减并重渲染顶部提示条 */
var fpTimer = null;
function startFpTimer(){
  if(fpTimer){ clearInterval(fpTimer); fpTimer = null; }
  fpTimer = setInterval(function(){
    if(S.view !== 'forgot'){ clearInterval(fpTimer); fpTimer = null; return; }
    if(S.data.remain == null) S.data.remain = 300;
    S.data.remain--;
    if(S.data.remain <= 0){
      S.data.remain = 0;
      clearInterval(fpTimer); fpTimer = null;
      S.data.fcode = '';
      toast('操作超时，请重新发起');
      logIt('忘密码操作超时，已重置');
      render();
      return;
    }
    /* 只更新倒计时文字，避免整页重渲染导致输入失焦 */
    var box = document.getElementById('fpTimerText');
    if(box){
      var mm = String(Math.floor(S.data.remain/60)).padStart(2,'0');
      var ss = String(S.data.remain%60).padStart(2,'0');
      box.textContent = mm + ':' + ss;
    }
    var bar = document.getElementById('fpTimerBar');
    if(bar) bar.style.width = Math.max(0, Math.round(S.data.remain/300*100)) + '%';
  }, 1000);
}

function startCountdown(btnId){
  var btn=document.getElementById(btnId);
  if(!btn) return;
  /* 按钮可能是「图标 + 文字」结构（做进输入框的验证码按钮），只改文字，别把图标冲掉 */
  function label(b){ return b.querySelector('span') || b; }
  var n=59;
  btn.disabled=true;
  label(btn).textContent=loc(n+'s 后重发');
  var t=setInterval(function(){
    n--;
    var b=document.getElementById(btnId);
    if(!b){ clearInterval(t); return; }
    if(n<=0){ clearInterval(t); b.disabled=false; label(b).textContent=loc('获取验证码'); return; }
    label(b).textContent=loc(n+'s 后重发');
  },1000);
}

  render();

/* 表单输入变化时：重算主按钮禁用态（不整页重渲染，避免输入框失焦） */
/* 同步主按钮禁用态 */
function syncMainBtn(){
  var main = document.querySelector('.btn-primary.btn-block');
  if(main) main.disabled = (S.net==='off') || !bindReady();
}

/* 绑定按钮可用性：按当前登录方式各自判定必填项。
   账密 = 账号 + 密码；扫码 = 二维码未过期；
   短信 = 手机号 + 验证码；动态口令 = 账号 + 口令。
   （绑定场景下密码是已设置的存量密码，不做策略校验） */
function bindReady(){
  function val(id){ var e=document.getElementById(id); return e ? (e.value||'').trim() : ''; }

  if(S.method === 'pw'){
    return !!(val('inUser') && val('inPw'));
  }
  if(S.method === 'qr'){
    return !S.data.qrExpired;          /* 二维码有效即可提交（模拟已扫） */
  }
  if(S.method === 'sms'){
    return !!(isPhone(val('inPhone')) && val('inSms'));
  }
  if(S.method === 'otp'){
    return !!(val('inUser') && val('inOtp'));
  }
  if(S.method === 'face' || S.method === 'fp'){
    var b = S.data.bio || {};
    return b.kind === S.method && b.st === 'ok';   /* 必须本方式比对通过 */
  }
  return false;
}
/* 账号输入：同步状态并刷新主按钮态；改了账号就撤掉上一次的登录失败提示 */
function onUserInput(v){
  /* 只有账号框（ipt 的 user:true）才带值调用，才更新「上次用的账号」。
     密码 / 验证码 / 口令 / 改密这些框调用时是空参，
     以前这里照样 S.data.user = v，等于把账号冲成空串 ——
     改密页敲一下新密码，绑定记录和「您好，XXX」就都丢了。 */
  if(v !== undefined){ S.data.user = v || ''; }
  if(S.data.loginErr){
    S.data.loginErr = null;
    S.data.canUnbind = false;
    var eb = document.querySelector('.win.auth .body>.errmsg');
    if(eb) eb.parentNode.removeChild(eb);
    /* 解绑入口是随失败态一起渲染出来的，摘错误条时必须一并摘掉，
       否则改了账号按钮还挂在那儿（漏这个 -> v1.0.7 实测发现） */
    var ub = document.querySelector('.win.auth .footrow .lnk.danger');
    if(ub) ub.parentNode.removeChild(ub);
    Array.prototype.forEach.call(
      document.querySelectorAll('.win.auth .input.bad'), function(el){
        el.classList.remove('bad');
      });
  }
  var main = document.querySelector('.win.auth .btn-primary.btn-block');
  if(!main) return;
  /* 只有「首因素凭据表单」的主按钮才由输入驱动（边输边解锁）。
     改密页 / 二次验证页 / 忘记密码页的主按钮各有自己的必填校验，
     不能被 bindReady() 联动禁用 —— 那条判定读的是首因素那几个输入框
     （inUser / inPw / inPhone / inSms / inOtp），这些页面上根本没有它们，
     一算就是 false，按钮会被永久禁用：输入新密码反而把「确定」点灰了。
     人脸 / 指纹页的主按钮是「开始识别」，同理不归这里管。 */
  if(S.step==='chpw' || S.second || S.view==='forgot') return;
  if(S.method==='face' || S.method==='fp') return;
  main.disabled = (S.net==='off') || !bindReady();
}

/* ---------- 动作 ---------- */
/* ── 绑定记录的唯二写入口（v1.0.8）────────────────────────────────
   「本机已绑定账号」要有可追溯的来源，就不能散落在各处直接赋值。
   写入只走 commitBind、清空只走 commitUnbind，别处一律不准直接改 S.bindIam。
   quiet=true 用于演示跳转通道（它自己已有一条日志，不必重复）。 */
function commitBind(iam, quiet){
  S.bindIam = iam || '';
  /* v1.0.10：绑定成功同时为该账号分配档案手机号（幂等，重复绑定拿同一个号） */
  if(S.bindIam) issuePhone(S.bindIam);
  if(!quiet) logIt('绑定记录写入 → 本机已绑定账号：'+S.bindIam);
}
function commitUnbind(){
  var old = S.bindIam;
  S.bindIam = '';
  logIt('绑定记录清除 → 解除了 '+old);
}

function doBind(){
  function val(id){ var e=document.getElementById(id); return e ? (e.value||'').trim() : ''; }

  /* 按当前登录方式校验必填项 */
  if(S.method==='pw'){
    if(!val('inUser')){ toast('请输入统一身份账号'); return; }
    if(!val('inPw')){ toast('请输入密码'); return; }
    S.data.user=val('inUser');
  } else if(S.method==='qr'){
    if(S.data.qrExpired){ toast('二维码已过期，请刷新后重试'); return; }
  } else if(S.method==='sms'){
    if(!val('inPhone')){ toast('请输入手机号码'); return; }
    if(!isPhone(val('inPhone'))){ toast('请输入正确的 11 位手机号码'); return; }
    if(!val('inSms')){ toast('请输入验证码'); return; }
    S.data.user = S.user || S.bindIam || 'zhangsan';
  } else if(S.method==='otp'){
    if(!val('inUser')){ toast('请输入统一身份账号'); return; }
    if(!val('inOtp')){ toast('请输入动态口令'); return; }
    S.data.user=val('inUser');
  }

  if(S.net==='off'){ toast('网络已断开，无法提交'); return; }

  /* v1.0.16：校验必填只代表「表单填完了」，不代表认证通过。
     真正的凭据认证（IAM 回答对不对）通过之后，还要按判定顺序
     继续过密码状态与二次验证 —— 见 startAuthFlow。 */
  startAuthFlow('bind', S.data.user || 'zhangsan');
}

/* 首次绑定的收尾：写绑定记录 + 成功提示 + 2 秒后收进菜单栏。
   抽出来是因为它现在是认证链的终点，不再由 doBind 直接调。 */
function commitBindAndWelcome(){
  S.user = S.data.authUser || S.data.user || 'zhangsan';
  S.bind=true; S.login=true;
  /* ★ 绑定记录的唯一写入口 —— 「本机已绑定账号」从此有了来源 */
  commitBind(S.user);
  logIt('绑定校验通过 → 窗口内提示成功 → 约 2 秒后自动关闭');

  /* 窗口内成功提示（不跳独立成功页） */
  var d=document.getElementById('desk');
  var w=d.querySelector('.win');
  if(w){
    var ov=document.createElement('div');
    ov.className='overlay';
    ov.innerHTML='<div class="dialog" style="width:250px"><div class="dbody" style="gap:0">'+
      '<div class="tickbox"><div class="tick">'+
      '<svg width="26" height="26" viewBox="0 0 24 24" fill="none">'+
      '<path d="M5.5 12.4l4.4 4.4 8.6-9.2" stroke="#34C759" stroke-width="2.2"'+
      ' stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
      '<div class="tt">绑定成功</div></div></div></div>';
    d.appendChild(ov);
  }
  renderMenuBar();
  setTimeout(function(){
    logIt('窗口关闭，收进菜单栏；图标点亮为 logo 原色');
    S.view='menubar'; render();
  }, 1800);
}

function doLogin(){
  function val(id){ var e=document.getElementById(id); return e ? (e.value||'').trim() : ''; }

  if(S.method==='pw'){
    if(!val('inUser')){ toast('请输入统一身份账号'); return; }
    if(!val('inPw')){ toast('请输入密码'); return; }
    S.data.user=val('inUser');
  } else if(S.method==='qr'){
    if(S.data.qrExpired){ toast('二维码已过期，请刷新后重试'); return; }
  } else if(S.method==='sms'){
    if(!val('inPhone')){ toast('请输入手机号码'); return; }
    if(!isPhone(val('inPhone'))){ toast('请输入正确的 11 位手机号码'); return; }
    if(!val('inSms')){ toast('请输入验证码'); return; }
    S.data.user = S.user || S.bindIam || 'zhangsan';
  } else if(S.method==='otp'){
    if(!val('inUser')){ toast('请输入统一身份账号'); return; }
    if(!val('inOtp')){ toast('请输入动态口令'); return; }
    S.data.user=val('inUser');
  }

  if(S.net==='off'){ toast('网络已断开，无法登录'); return; }

  /* ── 退出后登录页的登录判定，拆成两层（v1.0.7）─────────────
     第①层「凭据认证」：账号密码对不对，由 IAM 服务端回答。
       原型无法真的调 IAM，这里视为已通过（真实客户端在此步换取 token）。
     第②层「账号比对」：凭据对了，再看是不是本机绑定的那个账号 ——
       本机 OS 账号与 IAM 账号是 1:1 绑定，换个账号登进来会和绑定关系自相矛盾。
     拆两层的意义：第②层失败时，我们已经知道「来者是合法员工，只是不是本机绑定的那位」，
       而这正是「原绑定用户离职、电脑转交他人」的死锁场景 ——
       凭据既然已经认证过，就可以放出一条自助解绑的出路，无需再验任何东西。
     反过来，若第①层就失败，则只报凭据错误，绝不透露本机绑定了谁。

     「本机已绑定账号」读的是 S.bindIam —— 本机绑定记录里的那个统一身份账号，
     由 commitBind（绑定成功）/ commitUnbind（注销成功）唯二维护。
     它为空表示这台机器还没有绑定记录，此时**不做账号比对**（没记录可比，不凭空拦人）。 */
  S.data.canUnbind=false;
  if(S.view==='loginagain' && S.bindIam){
    var acc=(S.data.user||'').trim();
    if(acc && acc!==S.bindIam){
      S.data.canUnbind=true;                /* 凭据已通过 → 开放自助解绑 */
      S.data.loginErr='登录失败，本机已绑定账号：'+S.bindIam;
      logIt('凭据认证通过，但 '+acc+' 不是本机绑定账号 '+S.bindIam+' → 开放自助解绑');
      render();
      return;
    }
  }
  S.user=S.data.user||S.user||'zhangsan';

  /* v1.0.16：账号比对通过只说明「对的人」，还要过密码状态与二次验证。
     注意判定顺序 —— 账号比对排在改密/二次验证之前：
     账号都不对的人，让他改完密再验一遍二次验证，纯属白折腾。 */
  startAuthFlow('login', S.data.user||S.user);
}

/* 退出后登录的收尾：建立 IAM 会话，窗口收起。 */
function commitLoginAndWelcome(){
  S.user = S.data.authUser || S.data.user || S.user || 'zhangsan';
  S.bind=true; S.login=true;

function doExit(){

  logIt('确认退出：清 IAM 会话与浏览器单点态，保留绑定关系');
  S.view='loginagain';

function doCancel(){
  var fromLock=(S.data.cancelFrom==='lock');
  /* 死锁路径不重复验证：来者已在登录页通过 IAM 凭据认证 */
  if(!fromLock){
    var pw=document.getElementById('cancelPw');
    if(!pw || !pw.value){ S.data.cancelErr='请输入当前账号密码'; render(); return; }
  }
  S.modal=null;
  /* ★ 绑定记录的唯一清空点 */
  commitUnbind();
  logIt(fromLock ? '确认注销 → 解除绑定、清本地凭证与 IAM 会话'
                 : '身份验证通过 → 解除绑定、清本地凭证与 IAM 会话');
  S.bind=false; S.login=false; S.user='';
  S.data={};
  S.view='cancel3';
  render();
}

function toCancel2(){
  /* lock 路径不该出现密码输入步骤（见上）—— 万一有别的入口摸进来，这里兜住 */
  if(S.data.cancelFrom==='lock'){ doCancel(); return; }
  S.modal='cancel2'; S.data.cancelErr=null;
  logIt('点【确认注销】→ 进入身份验证');

  setTimeout(function(){ var el=document.getElementById('cancelPw'); if(el) el.focus(); }, 60);
}

    /* ⑦ 死锁路径：被拦下后可自助解绑（v1.0.7）——原绑定用户已离职 */
    { t: 1700, run: function(){
        askCancelFromLock();
        logIt('演示：原绑定用户已离职 → 走自助解绑'); } },
    { t: 1300, run: function(){ doCancel(); } },
    /* ⑧ 解绑后新用户完成绑定 → 绑定记录易主
       （v1.0.8 之前这里得手动塞 S.osUser='lisi'，因为绑定流程压根不写它 —— 那个 hack 已删） */
    { t: 2100, run: function(){
        S.user='lisi'; S.data.user='lisi';
        S.bind=true; S.login=true;
        commitBind(S.user);            /* 与 doBind() 走同一个写入口 */
        go('panel');
        logIt('lisi 完成绑定 → 本机绑定记录已变为 lisi'); } },
    /* ⑨ 已登录态从菜单栏面板注销（走密码验证那条路径） */
    { t: 1400, run: function(){ askCancel(); } },

/* ---------- 启动 ---------- */
/* 本文件就是「联动原型本体」（v1.0.17 起）。
   原先它叫 linked-prototype.html，被一个 11.9 KB 的 index.html「壳」
   用 <iframe> 装着 —— 那个壳除了转发什么都没有，已删除。
   现在独立打开这个文件，就是完整形态：桌面原型 + 流程轨道 + 状态面板
   + 操作日志 + 本页交互说明浮层。

   嵌入模式（v1.0.9 · 供交互说明页 iframe 调用）
   参数：
     ?embed=1            嵌入式形态：收掉工具条与调试入口，默认收起右侧流程轨道
     ?rail=1             配合 embed=1 用：轨道**展开**（说明页靠它看/点流程轨道）
     ?node=<视图名>      直接跳到该节点（视图名见 go() 的 switch）
   不带参数时行为与独立打开完全一致。

   四种组合：
     独立打开                      轨道展开 · 工具条在 · 日志在
     ?embed=1                     轨道收起 · 工具条藏 · 日志在
     ?embed=1&rail=1              轨道展开 · 工具条藏 · 日志在   ← 交互说明页用这个
     ?embed=1&rail=1&node=settings 同上 + 直达设置页

   v1.0.14：被嵌入时，每次换页会向外层 postMessage 一条
     { t:'e-login-view', node:<视图名>, name:<中文名> }
   交互说明页据此知道用户停在哪，右栏与跳转才不会落回首页。
   独立打开不发（window.parent === window）。 */
function bootFromQuery(){
  var q = new URLSearchParams(location.search);
  if(q.get('embed')==='1'){
    document.documentElement.classList.add('embedded');
    /* v1.0.13：把「嵌入形态」与「轨道是否收起」拆开。
       以前 embed=1 顺手就把轨道折了，导致嵌入页里看不到轨道。
       现在 rail=1 表示「嵌入形态但轨道展开」—— 交互说明页要的就是这个：
       左侧直接用联动轨道跳流程，右侧仍是那 72 条说明，两边互不影响。 */
    var keepRail = (q.get('rail') === '1');
    if(keepRail){
      /* 打上标记，让「收起轨道」按钮在嵌入形态下也放行 ——
         轨道能收起，就得能再展开，不然收起来就回不去了。 */
      document.documentElement.classList.add('rail-on');
    }else{
      document.getElementById('shell').classList.add('folded');
    }
    logIt('嵌入模式启动：' + (keepRail ? '流程轨道已展开' : '流程轨道已收起'));
  }
  var node = q.get('node');
  if(node){
    /* 认证链的两个步骤页（v1.0.21）：?node=chpw / ?node=second
       它们没有独立视图，靠 ELogin.go 里那段「补前置状态 + 进步骤」的分支直达。
       可交互 PRD 点 §3.10 / §3.11 时走的就是这条。 */
    if(node === 'chpw' || node === 'second'){
      window.ELogin.go(node);
      setTimeout(function(){
        /* 二次验证页没有专属类名，靠「返回上一级」按钮 + S.second 认它 */
        var ok = (node === 'chpw')
          ? !!document.querySelector('.chpw')
          : !!(S.second && document.querySelector('.backbtn'));
        logIt('嵌入模式直达认证链步骤 → ' + node + (ok ? '（已渲染）' : '（警告：未渲染出内容）'));
      }, 0);
      return;
    }
    /* 有些节点有前置条件（如 panel 需要已登录），直接 go() 会被守卫拦下。
       这里按节点补上必要的演示前置状态，让研发点进来看得到东西。 */
    var needBind  = ['menubar','panel','panel-off','apps','settings','exitok','loginagain','forgot',
                     'cancel','cancel2','cancel3','bind','bindfail'];
    var needLogin = ['panel','apps','settings','exitok'];
    if(needBind.indexOf(node)>=0){
      S.bind = true;
      if(!S.bindIam) commitBind('zhangsan', true);   /* 走唯一写入口 */
    }
    if(needLogin.indexOf(node)>=0){ S.login = true; S.user = S.bindIam || 'zhangsan'; }
    if(node==='loginagain'){ S.login = false; S.user = S.bindIam || 'zhangsan'; }
    /* 两种「未登录面板」要分开直达（v1.0.10 起该形态按有无绑定记录分流）：
       panel-off      —— 已绑定但退出登录（有记录，面板出现「登录统一身份」）
       panel-off-new  —— 全新机器，从未绑定过（无记录，面板出现「关联统一身份账号」）
       后者必须先清掉绑定记录，否则 commitBind 补上的 zhangsan 会把它变成前者。 */
    if(node==='panel-off'){
      S.login = false; S.user = '';
      if(!S.bindIam) commitBind('zhangsan', true);
    }
    if(node==='panel-off-new'){
      S.bind = true; S.bindIam = ''; S.login = false; S.user = '';
    }
    if(node==='bind'){ S.bind=false; S.bindIam=''; S.login=false; S.user=''; }
    if(node==='bindfail'){ S.bind=false; S.bindIam=''; S.login=false; S.user=''; S.view='bindfail'; render(); }
    else { go(node); }
    /* 直达后自检：确认渲染确实发生（研发/回归都能从日志看到） */
    setTimeout(function(){
      var hasWin = !!document.querySelector('.win, .pop');
      logIt('嵌入模式直达节点 → '+node+(hasWin?'（已渲染）':'（警告：未渲染出内容）'));
    }, 0);
  }
}
bootFromQuery();
logIt('原型启动：当前未绑定，等待首次绑定');
render();
/* v1.0.14：开场就把落点告诉外层。带 ?node= 直达时，bootFromQuery 已经把
   S.view 设好了，所以这一条就是「我现在停在这一页」的第一句话。 */
notifyHost();
