var resMap = {
  success:{cls:'ok', text:'成功'},
  partial:{cls:'partial', text:'部分成功'},
  fail:{cls:'fail', text:'失败'}
};

function renderTable(){
  var tb = document.getElementById('tbody');
  var html = '';
  for(var i=0;i<records.length;i++){
    var r = records[i], m = resMap[r.res];
    html += '<tr>'
      + '<td style="padding-left:20px">' + r.t + '</td>'
      + '<td>' + r.user + '</td>'
      + '<td>' + r.org + '</td>'
      + '<td>' + r.ip + '</td>'
      + '<td>' + r.evt + (r.isNew ? '<span class="tag-new">新增</span>' : '') + '</td>'
      + '<td>' + r.obj + '</td>'
      + '<td><span class="res ' + m.cls + '"><span class="dot ' + m.cls + '"></span>' + m.text + '</span></td>'
      + '<td><span class="link" onclick="openDrawer(' + i + ')">查看</span></td>'
      + '</tr>';
  }
  tb.innerHTML = html;
}
renderTable();

function openDrawer(i){
  var r = records[i], m = resMap[r.res], d = r.detail;
  var h = '';
  h += '<div class="sect"><div class="sect-t">操作信息</div><div class="kv">';
  h += row('操作时间', r.t);
  h += row('操作用户', r.user + (d.source ? '（系统任务）' : ''));
  h += row('所属机构', r.org);
  h += row('IP 地址', r.ip);
  h += row('操作事件', r.evt);
  h += row('操作对象', r.obj);
  h += row('操作结果', '<span class="res ' + m.cls + '"><span class="dot ' + m.cls + '"></span>' + m.text + '</span>');
  h += row('操作流水号', '<span class="mono">' + d.no + '</span>');
  h += '</div></div>';

  if(!d.noCascade){
    h += '<div class="sect"><div class="sect-t">删除对象</div><div class="kv">';
    h += row('用户账号', d.target.acc);
    h += row('姓名', d.target.name);
    h += row('工号', d.target.empNo);
    h += row('所属组织', d.target.org);
    h += '</div><div class="hint">用户已删除，以上为删除时刻的快照</div></div>';

    var sub = '共 ' + d.summary.total + ' 台，已解绑 ' + d.summary.ok + ' 台';
    if(d.summary.pending > 0){ sub += '，待清理 ' + d.summary.pending + ' 台'; }
    h += '<div class="sect"><div class="sect-head"><div class="sect-t">连带删除的终端绑定</div><div class="sect-sub">' + sub + '</div></div>';
    h += '<table class="dtable"><colgroup><col style="width:130px"><col style="width:150px"><col style="width:118px"><col style="width:126px"><col style="width:126px"><col style="width:100px"><\/colgroup>';
    h += '<thead><tr><th>终端名称</th><th>设备指纹</th><th>操作系统</th><th>最近登录</th><th>解绑时间</th><th>解绑结果</th></tr></thead><tbody>';
    for(var k=0;k<d.devices.length;k++){
      var dv = d.devices[k];
      var badge = dv.res === 'ok' ? '<span class="badge ok">已解绑</span>'
        : dv.res === 'cleared' ? '<span class="badge cleared">已补清</span>'
        : '<span class="badge pending">待清理</span>';
      h += '<tr><td>' + dv.name + '</td><td class="fp">' + dv.fp + '</td><td>' + dv.os + '</td><td>' + fmtMin(dv.last) + '</td><td>' + fmtMin(dv.un) + '</td><td>' + badge + '</td></tr>';
    }
    h += '</tbody></table>';
    h += '<div class="hint">' + (d.summary.pending > 0
      ? '终端离线时解绑指令无法送达，标记为待清理，上线后自动补清。'
      : '解绑同时清除终端本地的登录态与免登凭据，用户下次访问业务系统需重新认证。') + '</div>';
    h += '</div>';
  } else {
    h += '<div class="sect"><div class="sect-t">连带删除</div><div class="empty">该操作未连带删除终端绑定数据。</div></div>';
  }

  document.getElementById('drBody').innerHTML = h;
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}

function fmtMin(s){
  return (s && s.length > 16) ? s.substring(0, 16) : s;
}

function row(k,v){
  return '<div class="kv-row"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}

function closeDrawer(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}

function toggleMore(){
  var b = document.getElementById('moreBtn'), f = document.getElementById('frow2');
  b.classList.toggle('open'); f.classList.toggle('show');
}

function toggleGroup(el){
  var sub = el.nextElementSibling;
  var caret = el.querySelector('.nav-caret');
  if(sub && sub.classList.contains('nav-sub')){
    sub.classList.toggle('hide');
    if(caret) caret.classList.toggle('closed', sub.classList.contains('hide'));
  }
}

document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDrawer(); });
