<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E登录 Mac版 · 交互说明</title>
<style>
:root{
  --brand:#007AFF; --brand-hover:#0069DB; --brand-soft:#EAF3FF;
  --bg-page:#F4F5F7; --bg-card:#FFFFFF; --bg-field:#F7F8FA; --bg-hover:#F0F1F4;
  --border-card:#E8EAED; --border-field:#DDE0E4;
  --text-1:#1A1D21; --text-2:#6B7280; --text-3:#9CA3AF; --text-on:#FFFFFF;
  --success:#34C759; --success-soft:#EAF9EE;
  --warning:#FF9500; --warning-soft:#FFF4E5;
  --danger:#FF3B30; --danger-soft:#FFEDEC;
  --r-card:14px; --r-field:10px; --r-tag:8px;
  --top-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--bg-page); color:var(--text-1); font-size:13px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}

/* ============ 顶栏 ============ */
.top{
  height:var(--top-h);display:flex;align-items:center;gap:14px;
  padding:0 20px;background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--border-card);
  position:relative;z-index:30;
}
.top .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.top .brand img{width:30px;height:30px;display:block;border-radius:7px}
.top .brand .t{display:flex;flex-direction:column;justify-content:center}
.top h1{font-size:14px;font-weight:500;letter-spacing:-.2px;line-height:1.3}
.top .sub{font-size:11px;color:var(--text-3);line-height:1.3}
.top .sep{width:1px;height:22px;background:var(--border-card);flex:0 0 auto}
.top .grow{flex:1 1 auto;min-width:0}
.tag{
  display:inline-flex;align-items:center;height:22px;padding:0 8px;
  border-radius:var(--r-tag);font-size:11px;font-weight:500;white-space:nowrap;
}
.t-blue{background:var(--brand-soft);color:var(--brand)}
.t-gray{background:var(--bg-field);color:var(--text-2)}
.t-green{background:var(--success-soft);color:#248A3D}
.t-top{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}

/* ============ 主体：左右分栏 ============ */
.main{display:flex;height:calc(100% - var(--top-h))}

/* ---- 左：联动原型 ---- */
.stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:#DDE3EA}
.stage-bar{
  height:42px;display:flex;align-items:center;gap:8px;padding:0 14px;
  background:#FBFCFD;border-bottom:1px solid var(--border-card);flex:0 0 auto;
}
.stage-bar .cur{
  font-size:12px;font-weight:500;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:baseline;gap:7px;
}
.stage-bar .cur .id{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
  color:var(--text-3);
}
.stage-bar .hint{font-size:11px;color:var(--text-3);flex:0 0 auto}
.ib{
  height:26px;padding:0 10px;border:1px solid var(--border-field);
  background:#fff;border-radius:7px;font-size:11.5px;color:var(--text-2);
  cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;
  gap:5px;flex:0 0 auto;transition:background .12s,border-color .12s;
}
.ib:hover{background:var(--bg-hover);border-color:#C9CDD3;color:var(--text-1)}
.ib.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.ib.pri:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.stage-frame{flex:1 1 auto;position:relative;overflow:hidden;min-height:0}
.stage-frame iframe{
  width:100%;height:100%;border:0;display:block;background:#DDE3EA;
}
/* iframe 内的原型顶到容器上沿，macOS 菜单栏会贴着工具条 —— 留一条细缝分开 */
.stage-frame{padding-top:0}
.stage-frame::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:rgba(0,0,0,.06);z-index:2;pointer-events:none;
}

/* ---- 右：要求与验收 ---- */
.side{
  width:430px;flex:0 0 auto;background:#fff;border-left:1px solid var(--border-card);
  display:flex;flex-direction:column;overflow:hidden;
}
.side.filter{
  height:auto;flex:0 0 auto;padding:10px 14px 11px;
  border-bottom:1px solid var(--border-card);display:flex;
  flex-direction:column;gap:8px;
}
.flist{display:flex;flex-wrap:wrap;gap:5px}
.fbtn{
  height:24px;padding:0 9px;border:1px solid var(--border-field);background:#fff;
  border-radius:7px;font-size:11.5px;color:var(--text-2);cursor:pointer;
  font-family:inherit;transition:background .12s,border-color .12s,color .12s;
}
.fbtn:hover{background:var(--bg-hover);color:var(--text-1)}
.fbtn.on{background:var(--brand-soft);border-color:#BBD9F5;color:var(--brand);font-weight:500}
.fbtn .n{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;
  color:var(--text-3);margin-left:4px}
.fbtn.on .n{color:var(--brand);opacity:.7}

.side-body{flex:1 1 auto;overflow-y:auto;padding:0}

/* ---- 功能块 ---- */
.grp{border-bottom:1px solid var(--border-card);scroll-margin-top:0}
.grp:last-child{border-bottom:0}
.grp-h{
  display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer;
  user-select:none;transition:background .12s;
}
.grp-h:hover{background:var(--bg-hover)}
.grp-h .arw{
  width:12px;flex:0 0 auto;color:var(--text-3);font-size:9px;
  transition:transform .16s cubic-bezier(.32,.72,0,1);
}
.grp.open .grp-h .arw{transform:rotate(90deg)}
.grp-h .nm{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:500}
.grp-h .ct{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
  color:var(--text-3);flex:0 0 auto;
}
.grp-h.dim{opacity:.45}
.grp-b{display:none;padding:0 14px 14px}
.grp.open .grp-b{display:block}

/* ---- 交互点 ---- */
.pt{
  border:1px solid var(--border-card);border-radius:var(--r-field);
  margin-bottom:8px;background:#fff;overflow:hidden;
}
.pt:last-child{margin-bottom:0}
.pt-h{
  display:flex;align-items:flex-start;gap:8px;padding:9px 11px;cursor:pointer;
  user-select:none;transition:background .12s;
}
.pt-h:hover{background:var(--bg-hover)}
.pt-h .arw{
  width:10px;flex:0 0 auto;color:var(--text-3);font-size:8px;margin-top:5px;
  transition:transform .16s cubic-bezier(.32,.72,0,1);
}
.pt.open .pt-h .arw{transform:rotate(90deg)}
.pt-h .tx{flex:1 1 auto;min-width:0}
.pt-h .id{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;
  color:var(--brand);background:var(--brand-soft);padding:1px 5px;
  border-radius:5px;display:inline-block;margin-bottom:4px;
}
/* 「看效果」—— 该条目有自己的落点，点标题即可把左侧切过去 */
.pt-h .jn{
  font-size:10px;color:var(--brand);border:1px solid #BBD9FF;
  background:#FFF;padding:1px 5px;border-radius:5px;margin-left:6px;
  display:inline-block;margin-bottom:4px;white-space:nowrap;
}
.pt[data-node] .pt-h:hover .jn{background:var(--brand);color:#FFF;border-color:var(--brand)}
.pt-h .do{font-size:12px;line-height:1.55}
.pt-b{display:none;padding:0 11px 11px 29px}
.pt.open .pt-b{display:block}

.row{display:flex;gap:9px;padding:6px 0;border-top:1px solid #F1F2F4}
.row:first-child{border-top:0}
.row .k{
  flex:0 0 62px;font-size:11px;color:var(--text-3);padding-top:1px;
}
.row .v{flex:1 1 auto;min-width:0;font-size:11.5px;color:var(--text-2);line-height:1.62}
.row .v.q{color:var(--text-1)}
.row .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px}
.row .v .ok{color:#248A3D}
.row .v .er{color:#B3261E}
.row .v em{
  font-style:normal;background:var(--bg-field);padding:0 4px;border-radius:4px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--text-1);
}
.row.go .v a{
  color:var(--brand);text-decoration:none;font-size:11.5px;cursor:pointer;
  border-bottom:1px solid #BBD9F5;
}
.row.go .v a:hover{border-bottom-color:var(--brand)}

.empty{padding:30px 20px;text-align:center;color:var(--text-3);font-size:12px}

/* ---- 免责/说明条 ---- */
.note{
  margin:0 14px 14px;padding:10px 12px;background:var(--warning-soft);
  border-radius:var(--r-field);font-size:11.5px;color:#8A4B00;line-height:1.65;
}
.note b{font-weight:500}

/* ---- 全屏 ---- */
body.fs .top{display:none}
body.fs .main{height:100%}
body.fs .side{width:0;border-left:0;overflow:hidden}
body.fs .stage-bar{border-radius:0}
/* ---- 窄屏兜底（v1.0.13）----
   左侧 iframe 里现在带流程轨道（290px），右侧说明栏固定 430px。
   视口 ≤1150px 时中间的原型会被压到 430px 以下，窗口就缩得不像样了。
   这里**只在窄屏**收窄右栏，≥1200px 完全不动 ——
   1280 / 1366 / 1440 这些常规办公显示器不受任何影响。
   全屏态（body.fs .side，2 个 class）优先级更高，不受本文影响。 */
@media (max-width:1200px){ .side{width:370px} }
@media (max-width:1100px){ .side{width:330px} }
</style>
</head>
<body>

<!-- v1.0.14：94 条说明从 index 搬到了这一页。
     顶栏因此多了一个「← 联动原型」—— 想看大画面时一键回去，
     回来时还会把当前落点（?node=）带过去，不会重新回到首页。 -->
<div class="top">
  <div class="brand">
    <img src="assets/logo-color-128.png" alt="E登录">
    <div class="t">
      <h1>E 登录 · Mac 版 交互说明</h1>
      <div class="sub">左侧预览原型（流程轨道可直接点跳转），右侧逐条对照 —— 点分组切换流程，点条目展开验收条目</div>
    </div>
  </div>
  <div class="sep"></div>
  <div class="t-top">
    <span class="tag t-blue">联动原型 v1.0.14</span>
    <span class="tag t-gray">11 条流程 · 126 个交互点</span>
    <span class="tag t-green">交互表 v1.0</span>
  </div>
  <div class="grow"></div>
  <button class="ib" id="btnBack" title="回到「联动原型」页 —— 那边只有原型，画面更大">← 联动原型</button>
  <button class="ib" id="btnFold" title="展开/收起全部验收说明">展开全部说明</button>
  <button class="ib" id="btnFs" title="全屏看原型（Esc 退出）">全屏原型</button>
</div>

<div class="main">

  <!-- 左：联动原型 -->
  <div class="stage">
    <div class="stage-bar">
      <span class="cur"><span id="curName">首次绑定</span><span class="id" id="curId">M-BIND-001 ~ 012</span></span>
      <span class="hint">轨道可点跳转 · 窗口内可滚动</span>
      <button class="ib" id="btnReload" title="重新载入原型">↻ 重载</button>
      <button class="ib pri" id="btnOpen" title="在新标签打开（占满整屏，看得更舒展）">新标签打开</button>
    </div>
    <div class="stage-frame">
      <iframe id="frame" src="index.html?embed=1&rail=1&node=bind"
              title="E登录 Mac 版联动原型" allow="clipboard-write"></iframe>
    </div>
  </div>

  <!-- 右：要求与验收 -->
  <div class="side">
    <div class="side filter">
      <div class="flist" id="flist"></div>
    </div>
    <div class="side-body" id="sideBody"></div>
  </div>

</div>

/* 多个分组可能落在同一个节点（如「手动登录」与「退出与切换」都在退出后登录页；
   「日常自动登录」与「网络状态提示」都在菜单栏常驻）。
   这时左侧画面看起来"没变"，容易让人以为点漏了 ——
   下面给共享节点的分组算一个「落在哪」的说明，显示在标题旁。 */
(function(){
  var byNode = {};
  GROUPS.forEach(function(g){ if(g.node){ (byNode[g.node]=byNode[g.node]||[]).push(g.title); } });
  GROUPS.forEach(function(g){
    if(g.node && byNode[g.node].length>1) g.shared = byNode[g.node].length;
  });
})();

/* 把 node 为空的补上兜底说明 */
GROUPS.forEach(function(g){
  if(!g.node) g.noNode = true;
});

var elList  = document.getElementById('flist');
var elBody  = document.getElementById('sideBody');
var elFrame = document.getElementById('frame');
var elCurN  = document.getElementById('curName');
var elCurI  = document.getElementById('curId');
var cur = -1;
var curNode = null;      /* 当前 iframe 已加载的节点，避免同节点重复重载 */
var allOpen = false;
/* v1.0.14：index 跳过来时会带 ?node=xxx，开门就落在对应流程 ——
   不让「首次绑定」先闪一下再跳走。 */
var bootNode = new URLSearchParams(location.search).get('node');

/* ---- 渲染左侧过滤器 ---- */
function renderList(){
  elList.innerHTML = GROUPS.map(function(g,i){
    return '<button class="fbtn'+(i===cur?' on':'')+'" data-i="'+i+'">'+
             g.title+'<span class="n">'+g.count+'</span></button>';
  }).join('');
}

/* ---- 渲染右侧全部功能块 ---- */
function renderBody(){
  elBody.innerHTML = GROUPS.map(function(g,gi){
    var items = g.points.map(function(p,pi){
      var rows = '';
      rows += '<div class="row"><span class="k">交互 ID</span>'+
              '<span class="v mono">'+p.id+'</span></div>';
      if(p.page) rows += '<div class="row"><span class="k">所在页面</span>'+
              '<span class="v">'+p.page+'</span></div>';
      if(p.do)   rows += '<div class="row"><span class="k">触发</span>'+
              '<span class="v q">'+p.do+'</span></div>';
      if(p.ok)   rows += '<div class="row"><span class="k">预期结果</span>'+
              '<span class="v"><span class="ok">✓</span> '+p.ok+'</span></div>';
      if(p.err && p.err!=='无') rows += '<div class="row"><span class="k">异常处理</span>'+
              '<span class="v"><span class="er">!</span> '+p.err+'</span></div>';
      if(p.copy) rows += '<div class="row"><span class="k">提示语</span>'+
              '<span class="v mono">「'+p.copy+'」</span></div>';
      return '<div class="pt" data-g="'+gi+'" data-p="'+pi+'"'+
               (p.node ? ' data-node="'+p.node+'"' : '')+'>'+
               '<div class="pt-h"><span class="arw">▶</span><div class="tx">'+
                 '<span class="id">'+p.id+'</span>'+
                 (p.node ? '<span class="jn">看效果</span>' : '')+
                 '<div class="do">'+p.do+'</div>'+
               '</div></div>'+
               '<div class="pt-b">'+rows+'</div>'+
             '</div>';
    }).join('');

    var note = g.tip
      ? '<div class="note"><b>先说明一下左侧画面</b>：'+g.tip+'</div>'
      : (g.noNode
        ? '<div class="note"><b>这一组是全局行为</b>，不绑定单一界面 —— '+
          '左侧原型里可在任意页面手动切换网络状态来复现（全局轻提示条）。</div>'
        : '');

    return '<div class="grp" data-gi="'+gi+'">'+
             '<div class="grp-h"><span class="arw">▶</span>'+
               '<span class="nm">'+g.title+'</span>'+
               '<span class="ct">'+g.count+' 点</span></div>'+
             '<div class="grp-b">'+note+items+'</div>'+
           '</div>';
  }).join('');
}

/* ---- 切到某个分组 ---- */
function select(gi, silent){
  cur = gi;
  var g = GROUPS[gi];
  renderList();

  /* 右侧：展开该组、收起其余 */
  [].slice.call(elBody.querySelectorAll('.grp')).forEach(function(el,i){
    el.classList.toggle('open', i===gi);
  });
  elCurN.textContent = g.title;
  elCurI.textContent = g.points.length
    ? (g.points[0].id+' ~ '+g.points[g.points.length-1].id +
       (g.shared ? ' · 与同类流程共用界面' : ''))
    : '';
  /* 左侧：iframe 切节点。
     silent=true 表示「右栏跟着走，但别再动左边」—— 用户在 iframe 里点轨道
     跳到设置页时，左边已经是那一页了，再 load 一次只会把原型状态重置。 */
  if(g.node){
    if(!silent) load(g.node);
  }else{
    /* 没有专属节点：把左侧标题改成中性文案，避免出现
       「标题写着 A、画面停在 B」的错位（真实发现的 bug）。
       画面保持在当前节点不动 —— 网络状态是全局面板，任意页面都能切。 */
    elCurN.textContent = g.title;
    elCurI.textContent = '全局面板 · 见右侧说明';
    elBody.querySelector('.grp[data-gi="'+gi+'"]')
      .scrollIntoView({block:'start', behavior:'smooth'});
    return;
  }
  /* 滚到该组 */
  setTimeout(function(){
    var el = elBody.querySelector('.grp[data-gi="'+gi+'"]');
    if(el) el.scrollIntoView({block:'start', behavior:'smooth'});
  }, 60);
}

function load(node){
  /* 同一个节点不重复重载 —— 多个分组可能落在同一界面
     （手动登录 / 退出与切换 都在退出后登录页；日常自动登录 / 网络状态 都在菜单栏常驻）。
     重复重载会把原型状态重置，研发刚点的东西就没了。 */
  if(node === curNode){
    return;
  }
  curNode = node;
  /* 换 src 比 postMessage 稳（file:// 下也能用）；先置 about:blank 避免历史记录堆积 */
  /* rail=1：左侧保持流程轨道展开 —— 漏了它，点一次条目轨道就没了。 */
  var base = 'index.html?embed=1&rail=1&node=' + encodeURIComponent(node);
  elFrame.src = 'about:blank';
  setTimeout(function(){ elFrame.src = base; }, 30);
}

/* ---- 事件 ---- */
elList.addEventListener('click', function(e){
  var b = e.target.closest('.fbtn');
  if(!b) return;
  select(+b.dataset.i);
});

elBody.addEventListener('click', function(e){
  var h = e.target.closest('.grp-h');
  if(h){ h.parentNode.classList.toggle('open'); return; }
  var ph = e.target.closest('.pt-h');
  if(ph){
    var pt = ph.parentNode;
    pt.classList.toggle('open');
    /* 该条目若指定了自己的落点（同一界面的另一种状态），点它就切过去 ——
       分组级 node 给的是「典型状态」，个别条目要的是「另一种状态」，
       不切的话研发按说明去比对，左侧画面却对不上。 */
    var n = pt.getAttribute('data-node');
    if(n){
      load(n);
      elCurI.textContent = '正在看：' + (GROUPS[+pt.dataset.g].points[+pt.dataset.p].id);
    }
  }
});

document.getElementById('btnReload').addEventListener('click', function(){
  /* 强制重载：清掉 curNode 记忆，否则 load() 会认为「已在当前节点」而跳过 */
  curNode = null;
  load(GROUPS[cur] && GROUPS[cur].node ? GROUPS[cur].node : 'bind');
});

document.getElementById('btnOpen').addEventListener('click', function(){
  var node = GROUPS[cur] && GROUPS[cur].node ? GROUPS[cur].node : 'bind';
  window.open('index.html?node='+encodeURIComponent(node), '_blank');
});

/* ---- 回 index（v1.0.14）----
   index 没有说明栏，开场画面完全由 ?node= 决定 —— 所以回程必须带上落点，
   否则从设置页回去又被扔回「首次绑定」。 */
document.getElementById('btnBack').addEventListener('click', function(){
  location.href = 'index.html' + (curNode ? '?node=' + encodeURIComponent(curNode) : '');
});

/* ---- 跟着原型里的轨道走（v1.0.14）----
   左侧嵌的是同一个联动原型，用户完全可以直接点里面的流程轨道。
   原型每次换页会往外推一条 { t:'e-login-view', node:<视图名>, name:<中文名> }。
   不接这条消息的话，会出现「左边已经切到设置、右边还停在首次绑定」——
   看说明的人会以为是自己点漏了。
   （file:// 下外层读不到 iframe 的 location，只能由里往外推。） */
window.addEventListener('message', function(e){
  var d = e.data;
  if(!d || d.t !== 'e-login-view' || !d.node) return;
  /* 记住落点：重载 / 新标签打开 / 回 index 都要用它 */
  curNode = d.node;
  /* 右栏跟着走：找落在同一节点的分组（多个分组共用一个界面时取第一个） */
  var gi = -1;
  for(var i=0;i<GROUPS.length;i++){ if(GROUPS[i].node === d.node){ gi = i; break; } }
  if(gi >= 0){
    if(gi !== cur) select(gi, true);
  }
  /* 落在 11 条流程之外时**什么都不做**。
     原型里的视图比这 9 条多（退出成功页、注销过程的几步、无绑定记录的未登录面板……），
     这些界面本来就没有说明条目，硬切一个"最近的分组"只会让人对错号。
     另外这里也不能去改标题 —— 条目级的落点（如 M-MENU-007 的 panel-off-new）
     刚把标题写成「正在看：M-MENU-007」，一改就把它冲掉了。 */
});

document.getElementById('btnFs').addEventListener('click', function(){
  document.body.classList.toggle('fs');
  this.textContent = document.body.classList.contains('fs')
    ? '退出全屏' : '全屏原型';
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && document.body.classList.contains('fs')){
    document.body.classList.remove('fs');
    document.getElementById('btnFs').textContent = '全屏原型';
  }
});

document.getElementById('btnFold').addEventListener('click', function(){
  allOpen = !allOpen;
  [].slice.call(elBody.querySelectorAll('.pt')).forEach(function(el){
    el.classList.toggle('open', allOpen);
  });
  this.textContent = allOpen ? '收起全部说明' : '展开全部说明';
});

/* ---- 启动 ---- */
renderList();
renderBody();
/* ?node= 直达：找到落在该节点的分组（同一界面多个分组时取第一个）。
   找不到就退回第一条，行为与之前一致。 */
var bootGi = 0;
if(bootNode){
  for(var bi=0; bi<GROUPS.length; bi++){
    if(GROUPS[bi].node === bootNode){ bootGi = bi; break; }
  }
}
select(bootGi);
</script>
